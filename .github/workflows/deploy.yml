name: Deploy PujoPath to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'PujoPath (Web)/package-lock.json'

      - name: Install dependencies
        working-directory: PujoPath (Web)
        run: npm ci

      - name: Run automated test suite
        working-directory: PujoPath (Web)
        run: npm test

      - name: Build Next.js static export
        working-directory: PujoPath (Web)
        run: npm run build
        env:
          GITHUB_ACTIONS: 'true'

      - name: Setup client-side SPA routing fallback
        working-directory: PujoPath (Web)
        run: |
          test -f out/404.html || cp out/index.html out/404.html
          cp out/index.html out/200.html || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./PujoPath (Web)/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
