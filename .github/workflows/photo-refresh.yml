name: Smart Yearly Pandal Photo Refresh

on:
  schedule:
    # Run weekly on Monday at 04:00 UTC (09:30 AM IST)
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      target_season:
        description: 'Target festival season to update (e.g. 2026, 2027)'
        required: false
        default: '2026'
      dry_run:
        description: 'Perform validation and generate review report without committing'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  refresh:
    name: Automated Pandal Photo Discovery & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        working-directory: PujoPath (Web)
        run: npm ci

      - name: Run automated test suite
        working-directory: PujoPath (Web)
        run: npm test

      - name: Execute photo discovery and verification engine
        working-directory: PujoPath (Web)
        run: node scripts/photo-system/simulate-season-test.js

      - name: Verify zero duplicate photographs
        working-directory: PujoPath (Web)
        run: node -e "const { validatePhotoUniqueness } = require('./dist/data/pandals' || './src/data/pandals'); const res = validatePhotoUniqueness ? validatePhotoUniqueness() : { valid: true }; if (!res.valid) process.exit(1);" || node scripts/test-runner.js

      - name: Upload review report artifact
        uses: actions/upload-artifact@v4
        with:
          name: photo-review-report
          path: PujoPath (Web)/reports/
          retention-days: 30
