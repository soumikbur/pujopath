<?xml version="1.0" encoding="UTF-8"?>
<svg width="412" height="915" viewBox="0 0 412 915" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&amp;family=Inter:wght@400;500;600;700;800;900&amp;display=swap');
      text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .brand { font-family: 'Inter', system-ui, sans-serif; font-weight: 800; }
      .bengali { font-family: 'Hind Siliguri', 'Inter', sans-serif; }
    </style>
  </defs>

  <rect width="412" height="915" fill="#e5e3df"/>

  <!-- OpenStreetMap Style Realistic Map Canvas -->
  <g id="Cap_Map_Canvas">
    <!-- River Hooghly -->
    <path d="M 40 0 Q 90 250, 60 500 T 110 915" stroke="#b5d0e8" stroke-width="70" fill="none"/>
    <text x="70" y="420" fill="#7fa8cb" font-size="13" font-weight="700" transform="rotate(-80, 70, 420)">Hooghly River</text>

    <!-- Roads & Blocks -->
    <rect x="120" y="140" width="100" height="120" fill="#f2efe9" stroke="#e0dbd3" stroke-width="1"/>
    <rect x="240" y="140" width="140" height="120" fill="#f2efe9" stroke="#e0dbd3" stroke-width="1"/>
    <rect x="120" y="280" width="120" height="160" fill="#f2efe9" stroke="#e0dbd3" stroke-width="1"/>
    <rect x="260" y="280" width="120" height="160" fill="#f2efe9" stroke="#e0dbd3" stroke-width="1"/>

    <!-- Main Arteries -->
    <path d="M 0 270 L 412 270 M 0 450 L 412 450 M 0 600 L 412 600" stroke="#ffffff" stroke-width="8"/>
    <path d="M 115 0 L 115 915 M 245 0 L 245 915 M 375 0 L 375 915" stroke="#ffffff" stroke-width="8"/>

    <!-- Metro Transit Line (Blue) -->
    <path d="M 245 0 L 245 915" stroke="#3b82f6" stroke-width="3" stroke-dasharray="6 4"/>

    <!-- Pandal Diya Pins -->
    <!-- Bagbazar Pin -->
    <g transform="translate(180, 210)">
      <circle cx="0" cy="0" r="16" fill="#b42323"/>
      <text x="0" y="5" fill="#FFFFFF" font-size="12" font-weight="900" text-anchor="middle">1</text>
      <rect x="-60" y="-36" width="120" height="24" rx="6" fill="#FFFFFF" stroke="#e8e1d9" stroke-width="1"/>
      <text x="0" y="-20" fill="#1a1715" font-size="10" font-weight="800" text-anchor="middle">Bagbazar Sarbojanin</text>
    </g>

    <!-- Kumartuli Pin -->
    <g transform="translate(160, 360)">
      <circle cx="0" cy="0" r="16" fill="#0d9488"/>
      <text x="0" y="5" fill="#FFFFFF" font-size="12" font-weight="900" text-anchor="middle">2</text>
      <rect x="-50" y="-36" width="100" height="24" rx="6" fill="#FFFFFF" stroke="#e8e1d9" stroke-width="1"/>
      <text x="0" y="-20" fill="#1a1715" font-size="10" font-weight="800" text-anchor="middle">Kumartuli Park</text>
    </g>

    <!-- Sovabazar Pin -->
    <g transform="translate(300, 340)">
      <circle cx="0" cy="0" r="16" fill="#d97706"/>
      <text x="0" y="5" fill="#FFFFFF" font-size="12" font-weight="900" text-anchor="middle">3</text>
      <rect x="-55" y="-36" width="110" height="24" rx="6" fill="#FFFFFF" stroke="#e8e1d9" stroke-width="1"/>
      <text x="0" y="-20" fill="#1a1715" font-size="10" font-weight="800" text-anchor="middle">Sovabazar Rajbari</text>
    </g>
  </g>

  
  <!-- ANDROID SYSTEM STATUS BAR (40px) -->
  <g id="Android_Status_Bar">
    <rect width="412" height="40" fill="none"/>
    <text x="24" y="26" fill="#1A1715" font-size="14" font-weight="600">9:34</text>
    
    <g transform="translate(320, 14)">
      <!-- 5G Badge -->
      <text x="0" y="12" fill="#1A1715" font-size="11" font-weight="700">5G</text>
      <!-- Signal Bars -->
      <path d="M22 18 L22 14 M25 18 L25 10 M28 18 L28 6 M31 18 L31 2" stroke="#1A1715" stroke-width="2" stroke-linecap="round"/>
      <!-- Battery Icon -->
      <rect x="38" y="5" width="18" height="11" rx="3" stroke="#1A1715" stroke-width="1.5" fill="none"/>
      <rect x="40" y="7" width="11" height="7" fill="#1A1715"/>
      <line x1="57" y1="8" x2="57" y2="13" stroke="#1A1715" stroke-width="1.5"/>
    </g>
  </g>
  
  
  <!-- CAPACITOR ANDROID APP BAR (56px, NO INSTALL BUTTON) -->
  <g id="Capacitor_App_Bar" transform="translate(0, 40)">
    <rect width="412" height="56" fill="#fcfaf7" fill-opacity="0.96"/>
    <line x1="0" y1="56" x2="412" y2="56" stroke="#e8e1d9" stroke-width="1"/>

    <!-- Left Brand Logo (Clean text) -->
    <g transform="translate(18, 16)">
      <text x="0" y="22" fill="#b42323" font-size="22" font-weight="900" letter-spacing="-0.5" class="brand">PujoPath</text>
    </g>

    <!-- Right Controls: Moon Toggle, Language Pill, Favorites Heart -->
    <g id="Cap_Controls" transform="translate(240, 11)">
      <!-- Moon / Dark Mode Toggle -->
      <g id="Cap_Theme_Toggle">
        <rect width="36" height="36" rx="12" fill="#ffffff" stroke="#e8e1d9" stroke-width="1"/>
        <text x="18" y="23" fill="#625b55" font-size="14" text-anchor="middle">🌙</text>
      </g>

      <!-- Language Toggle Pill -->
      <g id="Cap_Lang_Toggle" transform="translate(44, 0)">
        <rect width="68" height="36" rx="12" fill="#ffffff" stroke="#e8e1d9" stroke-width="1"/>
        <rect x="3" y="3" width="30" height="30" rx="8" fill="#b42323"/>
        <text x="18" y="22" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">EN</text>
        <text x="48" y="22" fill="#625b55" font-size="11" font-weight="600" text-anchor="middle" class="bengali">বাংলা</text>
      </g>

      <!-- Favorites Heart Button -->
      <g id="Cap_Favorites" transform="translate(120, 0)">
        <rect width="36" height="36" rx="12" fill="#ffffff" stroke="#e8e1d9" stroke-width="1"/>
        <text x="18" y="23" fill="#625b55" font-size="15" text-anchor="middle">♡</text>
      </g>
    </g>
  </g>
  

  <!-- Floating Map Bottom Sheet (Selected Pandal Details) -->
  <g transform="translate(16, 680)">
    <rect width="380" height="136" rx="20" fill="#ffffff" stroke="#e8e1d9" stroke-width="1.5"/>
    <g transform="translate(18, 18)">
      <text x="0" y="14" fill="#b42323" font-size="10" font-weight="800">SELECTED PANDAL</text>
      <text x="0" y="38" fill="#1a1715" font-size="17" font-weight="900">Bagbazar Sarbojanin</text>
      <text x="0" y="58" fill="#625b55" font-size="12">Shyambazar Metro (450m) • Crowd: High</text>

      <g transform="translate(0, 72)">
        <rect width="166" height="34" rx="10" fill="#b42323"/>
        <text x="83" y="22" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">Get Directions ↗</text>

        <rect x="176" width="166" height="34" rx="10" fill="#fcfaf7" stroke="#e8e1d9" stroke-width="1"/>
        <text x="259" y="22" fill="#1a1715" font-size="12" font-weight="700" text-anchor="middle">+ Add to Trail</text>
      </g>
    </g>
  </g>

  
  <!-- CAPACITOR ANDROID BOTTOM NAVIGATION BAR (y=830) -->
  <g id="Capacitor_Bottom_Nav" transform="translate(0, 830)">
    <rect width="412" height="60" fill="#fcfaf7" fill-opacity="0.98"/>
    <line x1="0" y1="0" x2="412" y2="0" stroke="#e8e1d9" stroke-width="1"/>
    
      <g transform="translate(0, 4)">
        <rect x="14" y="2" width="54" height="46" rx="12" fill="transparent"/>
        <text x="41" y="22" font-size="16" text-anchor="middle">🏠</text>
        <text x="41" y="40" fill="#625b55" font-size="10" font-weight="500" text-anchor="middle">Home</text>
      </g>
    
      <g transform="translate(82, 4)">
        <rect x="14" y="2" width="54" height="46" rx="12" fill="transparent"/>
        <text x="41" y="22" font-size="16" text-anchor="middle">🔍</text>
        <text x="41" y="40" fill="#625b55" font-size="10" font-weight="500" text-anchor="middle">Explore</text>
      </g>
    
      <g transform="translate(164, 4)">
        <rect x="14" y="2" width="54" height="46" rx="12" fill="#fbe8e6"/>
        <text x="41" y="22" font-size="16" text-anchor="middle">📍</text>
        <text x="41" y="40" fill="#b42323" font-size="10" font-weight="800" text-anchor="middle">Map</text>
      </g>
    
      <g transform="translate(246, 4)">
        <rect x="14" y="2" width="54" height="46" rx="12" fill="transparent"/>
        <text x="41" y="22" font-size="16" text-anchor="middle">🔀</text>
        <text x="41" y="40" fill="#625b55" font-size="10" font-weight="500" text-anchor="middle">Planner</text>
      </g>
    
      <g transform="translate(328, 4)">
        <rect x="14" y="2" width="54" height="46" rx="12" fill="transparent"/>
        <text x="41" y="22" font-size="16" text-anchor="middle">☰</text>
        <text x="41" y="40" fill="#625b55" font-size="10" font-weight="500" text-anchor="middle">More</text>
      </g>
    
  </g>
  
  
  <!-- ANDROID SYSTEM GESTURE NAVIGATION PILL (y=890) -->
  <g id="Android_Gesture_Pill" transform="translate(0, 890)">
    <rect width="412" height="24" fill="none"/>
    <rect x="170" y="10" width="72" height="4" rx="2" fill="#1A1715" fill-opacity="0.8"/>
  </g>
  
</svg>