    <rect width="412" height="64" fill="#181411"/>
    <line x1="0" y1="0" x2="412" y2="0" stroke="#2a241f" stroke-width="1"/>
    
    <!-- Tab: Home -->
    <g transform="translate(12, 6)">
      
      <g transform="translate(25, 6)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a89e95" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        </svg>
      </g>
      <text x="35" y="37" fill="#a89e95" font-size="11" font-weight="600" text-anchor="middle">Home</text>
      
    </g>
    
    <!-- Tab: Explore -->
    <g transform="translate(90, 6)">
      
      <g transform="translate(25, 6)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a89e95" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"></path><circle cx="12" cy="12" r="10"></circle>
        </svg>
      </g>
      <text x="35" y="37" fill="#a89e95" font-size="11" font-weight="600" text-anchor="middle">Explore</text>
      
    </g>
    
    <!-- Tab: Map -->
    <g transform="translate(168, 6)">
      <rect x="0" y="0" width="70" height="48" rx="12" fill="#341b18"/>
      <g transform="translate(25, 6)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b42323" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle>
        </svg>
      </g>
      <text x="35" y="37" fill="#b42323" font-size="11" font-weight="700" text-anchor="middle">Map</text>
      <circle cx="35" cy="44" r="2" fill="#b42323"/>
    </g>
    
    <!-- Tab: Planner -->
    <g transform="translate(246, 6)">
      
      <g transform="translate(25, 6)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a89e95" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="19" r="3"></circle><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"></path><circle cx="18" cy="5" r="3"></circle>
        </svg>
      </g>
      <text x="35" y="37" fill="#a89e95" font-size="11" font-weight="600" text-anchor="middle">Planner</text>
      
    </g>
    
    <!-- Tab: More -->
    <g transform="translate(324, 6)">
      
      <g transform="translate(25, 6)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a89e95" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle><circle cx="5" cy="12" r="1.5"></circle>
        </svg>
      </g>
      <text x="35" y="37" fill="#a89e95" font-size="11" font-weight="600" text-anchor="middle">More</text>
      
    </g>
    
  </g>
  
  
  <!-- ANDROID SYSTEM GESTURE NAVIGATION PILL (Y=891) -->
  <g id="Android_Gesture_Pill" transform="translate(0, 891)">
    <rect width="412" height="24" fill="none"/>
    <rect x="170" y="10" width="72" height="4" rx="2" fill="#ffffff" fill-opacity="0.8"/>
  </g>
  
</svg>