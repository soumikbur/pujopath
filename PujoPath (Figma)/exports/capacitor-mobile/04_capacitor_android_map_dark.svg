<?xml version="1.0" encoding="UTF-8"?>
<svg width="412" height="915" viewBox="0 0 412 915" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&amp;family=Inter:wght@400;500;600;700;800;900&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .bengali { font-family: 'Hind Siliguri', 'Inter', sans-serif; }
      .brand { font-family: 'Inter', sans-serif; font-weight: 900; }
    </style>
  </defs>

  <rect width="412" height="915" fill="#14110e"/>

  
  <!-- ANDROID SYSTEM STATUS BAR (412 x 40) -->
  <g id="Android_Status_Bar">
    <rect width="412" height="40" fill="#14110e"/>
    <text x="24" y="26" fill="#ffffff" font-size="14" font-weight="600">9:34</text>
    
    <g transform="translate(320, 14)">
      <!-- 5G Badge -->
      <text x="0" y="12" fill="#ffffff" font-size="11" font-weight="700">5G</text>
      <!-- Signal Bars -->
      <path d="M22 18 L22 14 M25 18 L25 10 M28 18 L28 6 M31 18 L31 2" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <!-- Battery Icon -->
      <rect x="38" y="5" width="18" height="11" rx="3" stroke="#ffffff" stroke-width="1.5" fill="none"/>
      <rect x="40" y="7" width="11" height="7" fill="#ffffff"/>
      <line x1="57" y1="8" x2="57" y2="13" stroke="#ffffff" stroke-width="1.5"/>
    </g>
  </g>
  
  
  <!-- CAPACITOR ANDROID APP BAR (412 x 56, NO INSTALL BUTTON) -->
  <g id="Capacitor_App_Bar" transform="translate(0, 40)">
    <rect width="412" height="56" fill="rgba(20, 17, 14, 0.98)"/>
    <line x1="0" y1="56" x2="412" y2="56" stroke="#2a241f" stroke-width="1"/>

    <!-- Left Brand Logo -->
    <text x="18" y="36" fill="#b42323" font-size="22" font-weight="900" letter-spacing="-0.5" class="brand">PujoPath</text>

    <!-- Right Controls: Theme Toggle, Language Switcher, Favorites Heart -->
    <g id="Cap_Controls" transform="translate(240, 10)">
      <!-- Moon / Sun Toggle -->
      <g id="Cap_Theme_Toggle">
        <rect width="36" height="36" rx="11" fill="#1e1915" stroke="#3d3227" stroke-width="1"/>
        <text x="18" y="23" fill="#d4c7ba" font-size="14" text-anchor="middle">☀️</text>
      </g>

      <!-- Language Toggle Pill (EN / বাংলা) -->
      <g id="Cap_Lang_Toggle" transform="translate(44, 0)">
        <rect width="68" height="36" rx="11" fill="#1e1915" stroke="#3d3227" stroke-width="1"/>
        <rect x="3" y="3" width="30" height="30" rx="8" fill="#b42323"/>
        <text x="18" y="22" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">EN</text>
        <text x="48" y="22" fill="#d4c7ba" font-size="11" font-weight="600" text-anchor="middle" class="bengali">বাংলা</text>
      </g>

      <!-- Favorites Heart Button -->
      <g id="Cap_Favorites" transform="translate(120, 0)">
        <rect width="36" height="36" rx="11" fill="#1e1915" stroke="#3d3227" stroke-width="1"/>
        <text x="18" y="23" fill="#d4c7ba" font-size="15" text-anchor="middle">♡</text>
      </g>
    </g>
  </g>
  

  <!-- Top Filter Chips Bar -->
  <g id="Cap_Map_Filters" transform="translate(16, 108)">
    <rect x="0" width="56" height="32" rx="12" fill="#b42323"/>
    <text x="28" y="20" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">All</text>

    <rect x="62" width="108" height="32" rx="12" fill="#800020"/>
    <text x="116" y="20" fill="#fef08a" font-size="11" font-weight="800" text-anchor="middle">🏛️ Bonedi Bari</text>

    <rect x="176" width="98" height="32" rx="12" fill="#1e1915" stroke="#3d3227" stroke-width="1"/>
    <text x="225" y="20" fill="#f8f3ec" font-size="11" font-weight="600" text-anchor="middle">North Kolkata</text>

    <g transform="translate(282, 0)">
      <rect width="98" height="32" rx="12" fill="#341b18" stroke="#5a2722" stroke-width="1"/>
      <text x="14" y="20" font-size="12">🚆</text>
      <text x="32" y="20" fill="#b42323" font-size="11" font-weight="700">Metro</text>
    </g>
  </g>

  <!-- Interactive Map Canvas -->
  <g id="Map_Canvas" transform="translate(0, 148)">
    <rect width="412" height="600" fill="#1a1816"/>

    <!-- Hooghly River -->
    <path d="M70 0 C90 120 40 260 65 380 C85 470 50 540 60 600 L0 600 L0 0 Z" fill="#1b2a3a" stroke="#234160" stroke-width="1.5"/>
    <text x="28" y="280" fill="#3b6a9a" font-size="10" font-weight="700" transform="rotate(-75, 28, 280)">HOOGHLY RIVER</text>

    <!-- Bridges -->
    <line x1="45" y1="210" x2="110" y2="215" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <text x="80" y="204" fill="#94a3b8" font-size="8" font-weight="700">Howrah Bridge</text>

    <line x1="50" y1="440" x2="120" y2="445" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <text x="85" y="434" fill="#94a3b8" font-size="8" font-weight="700">Vidyasagar Setu</text>

    <!-- Major Road Networks -->
    <path d="M120 0 L130 600 M240 0 L250 600 M70 180 L412 190 M80 320 L412 330 M60 480 L412 490" stroke="#2e2722" stroke-width="3"/>
    <path d="M180 0 L185 600 M100 240 L412 250 M100 400 L412 410" stroke="#241f1a" stroke-width="1.8"/>

    <!-- Metro Blue Line 1 -->
    <path d="M190 20 L185 580" stroke="#3b82f6" stroke-width="3.5" stroke-dasharray="6,4"/>
    
    <!-- Metro Green Line 2 -->
    <path d="M30 310 L412 315" stroke="#22c55e" stroke-width="3.5" stroke-dasharray="6,4"/>

    <!-- Pandal Cluster Glowing Pins -->
    
  <g transform="translate(210, 80)">
    <circle cx="16" cy="16" r="20" fill="#b42323" fill-opacity="0.2"/>
    <circle cx="16" cy="16" r="14" fill="#b42323" stroke="#FFFFFF" stroke-width="2"/>
    <text x="16" y="20" fill="#FFFFFF" font-size="10" font-weight="900" text-anchor="middle">24</text>
    <g transform="translate(-14, 34)">
      <rect width="81" height="18" rx="6" fill="#1e1915" fill-opacity="0.95" stroke="#3d3227" stroke-width="1"/>
      <text x="40.5" y="13" fill="#f8f3ec" font-size="9" font-weight="700" text-anchor="middle">Shyambazar</text>
    </g>
  </g>
    
  <g transform="translate(140, 140)">
    <circle cx="16" cy="16" r="20" fill="#b42323" fill-opacity="0.2"/>
    <circle cx="16" cy="16" r="14" fill="#b42323" stroke="#FFFFFF" stroke-width="2"/>
    <text x="16" y="20" fill="#FFFFFF" font-size="10" font-weight="900" text-anchor="middle">18</text>
    <g transform="translate(-14, 34)">
      <rect width="74.5" height="18" rx="6" fill="#1e1915" fill-opacity="0.95" stroke="#3d3227" stroke-width="1"/>
      <text x="37.25" y="13" fill="#f8f3ec" font-size="9" font-weight="700" text-anchor="middle">Sovabazar</text>
    </g>
  </g>
    
  <g transform="translate(230, 240)">
    <circle cx="16" cy="16" r="20" fill="#b42323" fill-opacity="0.2"/>
    <circle cx="16" cy="16" r="14" fill="#b42323" stroke="#FFFFFF" stroke-width="2"/>
    <text x="16" y="20" fill="#FFFFFF" font-size="10" font-weight="900" text-anchor="middle">32</text>
    <g transform="translate(-14, 34)">
      <rect width="81" height="18" rx="6" fill="#1e1915" fill-opacity="0.95" stroke="#3d3227" stroke-width="1"/>
      <text x="40.5" y="13" fill="#f8f3ec" font-size="9" font-weight="700" text-anchor="middle">College Sq</text>
    </g>
  </g>
    
  <g transform="translate(280, 50)">
    <circle cx="16" cy="16" r="20" fill="#b42323" fill-opacity="0.2"/>
    <circle cx="16" cy="16" r="14" fill="#b42323" stroke="#FFFFFF" stroke-width="2"/>
    <text x="16" y="20" fill="#FFFFFF" font-size="10" font-weight="900" text-anchor="middle">15</text>
    <g transform="translate(-14, 34)">
      <rect width="61.5" height="18" rx="6" fill="#1e1915" fill-opacity="0.95" stroke="#3d3227" stroke-width="1"/>
      <text x="30.75" y="13" fill="#f8f3ec" font-size="9" font-weight="700" text-anchor="middle">Dum Dum</text>
    </g>
  </g>
    
  <g transform="translate(180, 360)">
    <circle cx="16" cy="16" r="20" fill="#b42323" fill-opacity="0.2"/>
    <circle cx="16" cy="16" r="14" fill="#b42323" stroke="#FFFFFF" stroke-width="2"/>
    <text x="16" y="20" fill="#FFFFFF" font-size="10" font-weight="900" text-anchor="middle">12</text>
    <g transform="translate(-14, 34)">
      <rect width="61.5" height="18" rx="6" fill="#1e1915" fill-opacity="0.95" stroke="#3d3227" stroke-width="1"/>
      <text x="30.75" y="13" fill="#f8f3ec" font-size="9" font-weight="700" text-anchor="middle">Park St</text>
    </g>
  </g>
    
  <g transform="translate(260, 440)">
    <circle cx="16" cy="16" r="20" fill="#b42323" fill-opacity="0.2"/>
    <circle cx="16" cy="16" r="14" fill="#b42323" stroke="#FFFFFF" stroke-width="2"/>
    <text x="16" y="20" fill="#FFFFFF" font-size="10" font-weight="900" text-anchor="middle">45</text>
    <g transform="translate(-14, 34)">
      <rect width="68" height="18" rx="6" fill="#1e1915" fill-opacity="0.95" stroke="#3d3227" stroke-width="1"/>
      <text x="34" y="13" fill="#f8f3ec" font-size="9" font-weight="700" text-anchor="middle">Gariahat</text>
    </g>
  </g>
    
  <g transform="translate(150, 510)">
    <circle cx="16" cy="16" r="20" fill="#b42323" fill-opacity="0.2"/>
    <circle cx="16" cy="16" r="14" fill="#b42323" stroke="#FFFFFF" stroke-width="2"/>
    <text x="16" y="20" fill="#FFFFFF" font-size="10" font-weight="900" text-anchor="middle">28</text>
    <g transform="translate(-14, 34)">
      <rect width="55" height="18" rx="6" fill="#1e1915" fill-opacity="0.95" stroke="#3d3227" stroke-width="1"/>
      <text x="27.5" y="13" fill="#f8f3ec" font-size="9" font-weight="700" text-anchor="middle">Behala</text>
    </g>
  </g>

    <!-- Zoom Controls -->
    <g transform="translate(360, 20)">
      <rect width="36" height="74" rx="10" fill="#1e1915" stroke="#3d3227" stroke-width="1" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))"/>
      <text x="18" y="26" fill="#f8f3ec" font-size="18" font-weight="700" text-anchor="middle">+</text>
      <line x1="6" y1="37" x2="30" y2="37" stroke="#3d3227" stroke-width="1"/>
      <text x="18" y="58" fill="#f8f3ec" font-size="18" font-weight="700" text-anchor="middle">−</text>
    </g>
  </g>

  <!-- Bottom Floating Sheet -->
  <g id="Cap_Map_Floating_Bar" transform="translate(14, 735)">
    <rect width="384" height="70" rx="18" fill="#1e1915" stroke="#3d3227" stroke-width="1" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))"/>
    
    <g transform="translate(14, 15)">
      <!-- Route Icon in soft red pill -->
      <rect width="38" height="38" rx="12" fill="#341b18"/>
      <text x="19" y="24" font-size="16" text-anchor="middle">🔀</text>

      <!-- Summary Copy -->
      <g transform="translate(48, 6)">
        <text x="0" y="12" fill="#f8f3ec" font-size="13" font-weight="900">0 Pandals Selected</text>
        <text x="0" y="26" fill="#d4c7ba" font-size="10">Click "Add Route" on any card to build trail</text>
      </g>

      <!-- Actions: Open Planner button + Dismiss X -->
      <g transform="translate(242, 4)">
        <rect width="84" height="32" rx="10" fill="#1e1915" stroke="#3d3227" stroke-width="1"/>
        <text x="42" y="20" fill="#f8f3ec" font-size="11" font-weight="700" text-anchor="middle">Open Plan</text>

        <text x="100" y="21" fill="#d4c7ba" font-size="14" text-anchor="middle">✕</text>
      </g>
    </g>
  </g>

  <!-- Fixed Bottom Navigation + Gesture Pill -->
  
  <!-- CAPACITOR ANDROID BOTTOM NAVIGATION (412 x 64, Y=827) -->
