<?xml version="1.0" encoding="UTF-8"?>
<svg width="412" height="1650" viewBox="0 0 412 1650" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&amp;family=Inter:wght@400;500;600;700;800;900&amp;display=swap');
      text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .brand { font-family: 'Inter', system-ui, sans-serif; font-weight: 800; }
      .bengali { font-family: 'Hind Siliguri', 'Inter', sans-serif; }
    </style>
  </defs>

  <rect width="412" height="1650" fill="#fcfaf7"/>

  
  <!-- ANDROID SYSTEM STATUS BAR (40px) -->
  <g id="Android_Status_Bar">
    <rect width="412" height="40" fill="none"/>
    <text x="24" y="26" fill="#1A1715" font-size="14" font-weight="600">9:34</text>
    
    <g transform="translate(320, 14)">
      <!-- 5G Badge -->
      <text x="0" y="12" fill="#1A1715" font-size="11" font-weight="700">5G</text>
      <!-- Signal Bars -->
      <path d="M22 18 L22 14 M25 18 L25 10 M28 18 L28 6 M31 18 L31 2" stroke="#1A1715" stroke-width="2" stroke-linecap="round"/>
      <!-- Battery Icon -->
      <rect x="38" y="5" width="18" height="11" rx="3" stroke="#1A1715" stroke-width="1.5" fill="none"/>
      <rect x="40" y="7" width="11" height="7" fill="#1A1715"/>
      <line x1="57" y1="8" x2="57" y2="13" stroke="#1A1715" stroke-width="1.5"/>
    </g>
  </g>
  
  
  <!-- CAPACITOR ANDROID APP BAR (56px, NO INSTALL BUTTON) -->
  <g id="Capacitor_App_Bar" transform="translate(0, 40)">
    <rect width="412" height="56" fill="#fcfaf7" fill-opacity="0.96"/>
    <line x1="0" y1="56" x2="412" y2="56" stroke="#e8e1d9" stroke-width="1"/>

    <!-- Left Brand Logo (Clean text) -->
    <g transform="translate(18, 16)">
      <text x="0" y="22" fill="#b42323" font-size="22" font-weight="900" letter-spacing="-0.5" class="brand">PujoPath</text>
    </g>

    <!-- Right Controls: Moon Toggle, Language Pill, Favorites Heart -->
    <g id="Cap_Controls" transform="translate(240, 11)">
      <!-- Moon / Dark Mode Toggle -->
      <g id="Cap_Theme_Toggle">
        <rect width="36" height="36" rx="12" fill="#ffffff" stroke="#e8e1d9" stroke-width="1"/>
        <text x="18" y="23" fill="#625b55" font-size="14" text-anchor="middle">🌙</text>
      </g>

      <!-- Language Toggle Pill -->
      <g id="Cap_Lang_Toggle" transform="translate(44, 0)">
        <rect width="68" height="36" rx="12" fill="#ffffff" stroke="#e8e1d9" stroke-width="1"/>
        <rect x="3" y="3" width="30" height="30" rx="8" fill="#b42323"/>
        <text x="18" y="22" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">EN</text>
        <text x="48" y="22" fill="#625b55" font-size="11" font-weight="600" text-anchor="middle" class="bengali">বাংলা</text>
      </g>

      <!-- Favorites Heart Button -->
      <g id="Cap_Favorites" transform="translate(120, 0)">
        <rect width="36" height="36" rx="12" fill="#ffffff" stroke="#e8e1d9" stroke-width="1"/>
        <text x="18" y="23" fill="#625b55" font-size="15" text-anchor="middle">♡</text>
      </g>
    </g>
  </g>
  

  <g transform="translate(16, 108)">
    <text x="0" y="24" fill="#1a1715" font-size="24" font-weight="900">Route Planner</text>
    <text x="0" y="46" fill="#625b55" font-size="12">Optimized trail with crowd &amp; metro integration.</text>

    <!-- Metrics Bar (Matching actual_cap_planner.png) -->
    <g transform="translate(0, 65)">
      <rect width="380" height="76" rx="16" fill="#ffffff" stroke="#e8e1d9" stroke-width="1"/>
      <g transform="translate(18, 16)">
        <text x="0" y="14" fill="#b42323" font-size="10" font-weight="800">OPTIMIZED TRAIL</text>
        <text x="0" y="36" fill="#1a1715" font-size="16" font-weight="800">North Heritage Trail • 4 Stops</text>
        <text x="344" y="36" fill="#625b55" font-size="12" text-anchor="end">3.4 km • ~2h 15m</text>
      </g>
    </g>

    <!-- Stop 1 -->
    <g transform="translate(0, 160)">
      <rect width="380" height="72" rx="14" fill="#ffffff" stroke="#e8e1d9" stroke-width="1"/>
      <circle cx="28" cy="36" r="12" fill="#b42323"/>
      <text x="28" y="40" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">1</text>
      <text x="52" y="30" fill="#1a1715" font-size="13" font-weight="700">Bagbazar Sarbojanin</text>
      <text x="52" y="48" fill="#625b55" font-size="10">Start • Shyambazar Metro • Est. 35 mins</text>
      <text x="350" y="38" fill="#625b55" font-size="14">⋮⋮</text>
    </g>
    <text x="28" y="252" fill="#625b55" font-size="10" text-anchor="middle">🚶 8 mins (600m)</text>

    <!-- Stop 2 -->
    <g transform="translate(0, 268)">
      <rect width="380" height="72" rx="14" fill="#ffffff" stroke="#e8e1d9" stroke-width="1"/>
      <circle cx="28" cy="36" r="12" fill="#0d9488"/>
      <text x="28" y="40" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">2</text>
      <text x="52" y="30" fill="#1a1715" font-size="13" font-weight="700">Kumartuli Park</text>
      <text x="52" y="48" fill="#625b55" font-size="10">Artisan Sculptures • Est. 40 mins</text>
      <text x="350" y="38" fill="#625b55" font-size="14">⋮⋮</text>
    </g>
    <text x="28" y="360" fill="#625b55" font-size="10" text-anchor="middle">🚶 12 mins (850m)</text>

    <!-- Stop 3 -->
    <g transform="translate(0, 376)">
      <rect width="380" height="72" rx="14" fill="#ffffff" stroke="#e8e1d9" stroke-width="1"/>
      <circle cx="28" cy="36" r="12" fill="#d97706"/>
      <text x="28" y="40" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">3</text>
      <text x="52" y="30" fill="#1a1715" font-size="13" font-weight="700">Sovabazar Rajbari</text>
      <text x="52" y="48" fill="#625b55" font-size="10">Bonedi Bari Courtyard • Est. 45 mins</text>
      <text x="350" y="38" fill="#625b55" font-size="14">⋮⋮</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(0, 475)">
      <rect width="380" height="46" rx="12" fill="#b42323"/>
      <text x="190" y="28" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">🗺️ Open in Google Maps</text>

      <g transform="translate(0, 56)">
        <rect width="380" height="46" rx="12" fill="#ffffff" stroke="#e8e1d9" stroke-width="1"/>
        <text x="190" y="28" fill="#1a1715" font-size="13" font-weight="700" text-anchor="middle">🔗 Share Trail</text>
      </g>
    </g>
  </g>

  
  <!-- CAPACITOR ANDROID BOTTOM NAVIGATION BAR (y=1566) -->
  <g id="Capacitor_Bottom_Nav" transform="translate(0, 1566)">
    <rect width="412" height="60" fill="#fcfaf7" fill-opacity="0.98"/>
    <line x1="0" y1="0" x2="412" y2="0" stroke="#e8e1d9" stroke-width="1"/>
    
      <g transform="translate(0, 4)">
        <rect x="14" y="2" width="54" height="46" rx="12" fill="transparent"/>
        <text x="41" y="22" font-size="16" text-anchor="middle">🏠</text>
        <text x="41" y="40" fill="#625b55" font-size="10" font-weight="500" text-anchor="middle">Home</text>
      </g>
    
      <g transform="translate(82, 4)">
        <rect x="14" y="2" width="54" height="46" rx="12" fill="transparent"/>
        <text x="41" y="22" font-size="16" text-anchor="middle">🔍</text>
        <text x="41" y="40" fill="#625b55" font-size="10" font-weight="500" text-anchor="middle">Explore</text>
      </g>
    
      <g transform="translate(164, 4)">
        <rect x="14" y="2" width="54" height="46" rx="12" fill="transparent"/>
        <text x="41" y="22" font-size="16" text-anchor="middle">📍</text>
        <text x="41" y="40" fill="#625b55" font-size="10" font-weight="500" text-anchor="middle">Map</text>
      </g>
    
      <g transform="translate(246, 4)">
        <rect x="14" y="2" width="54" height="46" rx="12" fill="#fbe8e6"/>
        <text x="41" y="22" font-size="16" text-anchor="middle">🔀</text>
        <text x="41" y="40" fill="#b42323" font-size="10" font-weight="800" text-anchor="middle">Planner</text>
      </g>
    
      <g transform="translate(328, 4)">
        <rect x="14" y="2" width="54" height="46" rx="12" fill="transparent"/>
        <text x="41" y="22" font-size="16" text-anchor="middle">☰</text>
        <text x="41" y="40" fill="#625b55" font-size="10" font-weight="500" text-anchor="middle">More</text>
      </g>
    
  </g>
  
  
  <!-- ANDROID SYSTEM GESTURE NAVIGATION PILL (y=1626) -->
  <g id="Android_Gesture_Pill" transform="translate(0, 1626)">
    <rect width="412" height="24" fill="none"/>
    <rect x="170" y="10" width="72" height="4" rx="2" fill="#1A1715" fill-opacity="0.8"/>
  </g>
  
</svg>