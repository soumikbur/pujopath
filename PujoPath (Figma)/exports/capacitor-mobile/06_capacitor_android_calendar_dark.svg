          <text x="14" y="20" fill="#f8f3ec" font-size="12" font-weight="700" class="bengali">বিশুদ্ধ সিদ্ধান্ত (Bisuddha Siddhanta)</text>
          <text x="14" y="34" fill="#b42323" font-size="11" font-weight="700">05:24 PM – 06:12 PM</text>
          <text x="320" y="26" fill="#b42323" font-size="12" font-weight="800" text-anchor="end">✓</text>
        </g>

        <!-- Convention 2 -->
        <g transform="translate(0, 142)">
          <rect width="336" height="44" rx="12" fill="#251e18" stroke="#3d3227" stroke-width="1"/>
          <text x="14" y="20" fill="#f8f3ec" font-size="12" font-weight="600" class="bengali">সূর্যসিদ্ধান্ত (Surya Siddhanta / Gupta Press)</text>
          <text x="14" y="34" fill="#d4c7ba" font-size="11">05:48 PM – 06:36 PM</text>
        </g>
      </g>
    </g>
  </g>

  <!-- 5 Sacred Days -->
