        <text x="18" y="23" fill="#d4c7ba" font-size="15" text-anchor="middle">♡</text>
      </g>
    </g>
  </g>
  

  <!-- Page Header -->
  <g id="Cap_Cal_Header" transform="translate(20, 114)">
