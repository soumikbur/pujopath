<?xml version="1.0" encoding="UTF-8"?>
<svg width="412" height="1850" viewBox="0 0 412 1850" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&amp;family=Inter:wght@400;500;600;700;800;900&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .bengali { font-family: 'Hind Siliguri', 'Inter', sans-serif; }
      .brand { font-family: 'Inter', sans-serif; font-weight: 900; }
    </style>
  </defs>

  <rect width="412" height="1850" fill="#14110e"/>

  
  <!-- ANDROID SYSTEM STATUS BAR (412 x 40) -->
  <g id="Android_Status_Bar">
    <rect width="412" height="40" fill="#14110e"/>
    <text x="24" y="26" fill="#ffffff" font-size="14" font-weight="600">9:34</text>
    
    <g transform="translate(320, 14)">
      <!-- 5G Badge -->
      <text x="0" y="12" fill="#ffffff" font-size="11" font-weight="700">5G</text>
      <!-- Signal Bars -->
      <path d="M22 18 L22 14 M25 18 L25 10 M28 18 L28 6 M31 18 L31 2" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <!-- Battery Icon -->
      <rect x="38" y="5" width="18" height="11" rx="3" stroke="#ffffff" stroke-width="1.5" fill="none"/>
      <rect x="40" y="7" width="11" height="7" fill="#ffffff"/>
      <line x1="57" y1="8" x2="57" y2="13" stroke="#ffffff" stroke-width="1.5"/>
    </g>
  </g>
  
  
  <!-- CAPACITOR ANDROID APP BAR (412 x 56, NO INSTALL BUTTON) -->
  <g id="Capacitor_App_Bar" transform="translate(0, 40)">
    <rect width="412" height="56" fill="rgba(20, 17, 14, 0.98)"/>
    <line x1="0" y1="56" x2="412" y2="56" stroke="#2a241f" stroke-width="1"/>

    <!-- Left Brand Logo -->
    <text x="18" y="36" fill="#b42323" font-size="22" font-weight="900" letter-spacing="-0.5" class="brand">PujoPath</text>

    <!-- Right Controls: Theme Toggle, Language Switcher, Favorites Heart -->
    <g id="Cap_Controls" transform="translate(240, 10)">
      <!-- Moon / Sun Toggle -->
      <g id="Cap_Theme_Toggle">
        <rect width="36" height="36" rx="11" fill="#1e1915" stroke="#3d3227" stroke-width="1"/>
        <text x="18" y="23" fill="#d4c7ba" font-size="14" text-anchor="middle">☀️</text>
      </g>

      <!-- Language Toggle Pill (EN / বাংলা) -->
      <g id="Cap_Lang_Toggle" transform="translate(44, 0)">
        <rect width="68" height="36" rx="11" fill="#1e1915" stroke="#3d3227" stroke-width="1"/>
        <rect x="3" y="3" width="30" height="30" rx="8" fill="#b42323"/>
        <text x="18" y="22" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">EN</text>
        <text x="48" y="22" fill="#d4c7ba" font-size="11" font-weight="600" text-anchor="middle" class="bengali">বাংলা</text>
      </g>

