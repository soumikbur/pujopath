<?xml version="1.0" encoding="UTF-8"?>
<svg width="412" height="2100" viewBox="0 0 412 2100" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&amp;family=Inter:wght@400;500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      text { font-family: 'Inter', system-ui, sans-serif; }
      .title { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; }
      .bengali { font-family: 'Hind Siliguri', 'Inter', sans-serif; }
    </style>
  </defs>

  <rect width="412" height="2100" fill="#FCFAF7"/>
  
  <!-- ANDROID SYSTEM STATUS BAR (40px) -->
  <g id="Android_Status_Bar">
    <rect width="412" height="40" fill="#FCFAF7"/>
    <text x="20" y="26" fill="#242424" font-size="14" font-weight="600">9:34</text>
    <g transform="translate(330, 14)">
      <text x="0" y="12" fill="#242424" font-size="12" font-weight="700">5G</text>
      <text x="22" y="12" fill="#242424" font-size="12">📶</text>
      <text x="44" y="12" fill="#242424" font-size="12">🔋</text>
    </g>
  </g>
  

  <!-- Capacitor Header -->
  <g id="Header_Capacitor" transform="translate(0, 40)">
    <rect width="412" height="56" fill="#FFFFFF"/>
    <line x1="0" y1="56" x2="412" y2="56" stroke="#E8E1D9" stroke-width="1"/>
    <g transform="translate(16, 12)">
      <rect width="32" height="32" rx="8" fill="#b42323"/>
      <text x="16" y="21" fill="#FFFFFF" font-size="15" font-weight="800" text-anchor="middle">P</text>
      <text x="40" y="22" fill="#242424" font-size="17" font-weight="800">PujoPath</text>
    </g>
    <g transform="translate(350, 12)">
      <rect width="44" height="32" rx="8" fill="#F5F1EB" stroke="#E8E1D9" stroke-width="1"/>
      <text x="22" y="20" fill="#b42323" font-size="11" font-weight="700" text-anchor="middle" class="bengali">বাংলা</text>
    </g>
  </g>

  <!-- Body -->
  <g id="Capacitor_Explore_Body" transform="translate(16, 116)">
    <text x="0" y="20" fill="#242424" font-size="24" font-weight="800" class="title">Explore Pandals</text>
    <text x="0" y="42" fill="#7E7268" font-size="13">774 pandals mapped with offline GPS</text>

    <!-- Search Input -->
    <g transform="translate(0, 58)">
      <rect width="380" height="46" rx="14" fill="#FFFFFF" stroke="#E8E1D9" stroke-width="1"/>
      <text x="16" y="28" font-size="16">🔍</text>
      <text x="44" y="28" fill="#7E7268" font-size="13">Search pandal, area, or metro...</text>
    </g>

    <!-- Zone Filter Pills -->
    <g transform="translate(0, 116)">
      <rect x="0" width="80" height="32" rx="16" fill="#b42323"/>
      <text x="40" y="21" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">All (774)</text>

      <rect x="88" width="95" height="32" rx="16" fill="#FFFFFF" stroke="#E8E1D9" stroke-width="1"/>
      <text x="135" y="21" fill="#242424" font-size="12" font-weight="600" text-anchor="middle">North (182)</text>

      <rect x="191" width="95" height="32" rx="16" fill="#FFFFFF" stroke="#E8E1D9" stroke-width="1"/>
      <text x="238" y="21" fill="#242424" font-size="12" font-weight="600" text-anchor="middle">South (214)</text>

      <rect x="294" width="84" height="32" rx="16" fill="#FFFFFF" stroke="#E8E1D9" stroke-width="1"/>
      <text x="336" y="21" fill="#242424" font-size="12" font-weight="600" text-anchor="middle">Central</text>
    </g>

    <!-- Pandal Cards Stack -->
    <g transform="translate(0, 164)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="380" height="310" rx="20" fill="#FFFFFF" stroke="#E8E1D9" stroke-width="1"/>
        <rect width="380" height="150" rx="20" fill="#a82323"/>
        <text x="190" y="80" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">Bagbazar Sarbojanin Photo</text>
        <g transform="translate(16, 168)">
          <rect width="90" height="22" rx="11" fill="#fdeeee"/>
          <text x="45" y="15" fill="#b42323" font-size="10" font-weight="700" text-anchor="middle">North Kolkata</text>
          <text x="0" y="44" fill="#242424" font-size="18" font-weight="800">Bagbazar Sarbojanin</text>
          <text x="0" y="66" fill="#7E7268" font-size="13" class="bengali">বাগবাজার সর্বজনীন দুর্গোৎসব</text>
          <text x="0" y="92" fill="#5C524A" font-size="12">🚇 Shyambazar • 🚶 500m • 👥 High Crowd</text>
        </g>
      </g>

      <!-- Card 2 -->
      <g transform="translate(0, 326)">
        <rect width="380" height="310" rx="20" fill="#FFFFFF" stroke="#E8E1D9" stroke-width="1"/>
        <rect width="380" height="150" rx="20" fill="#c2410c"/>
        <text x="190" y="80" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">Kumartuli Park Photo</text>
        <g transform="translate(16, 168)">
          <rect width="90" height="22" rx="11" fill="#fdeeee"/>
          <text x="45" y="15" fill="#b42323" font-size="10" font-weight="700" text-anchor="middle">North Kolkata</text>
          <text x="0" y="44" fill="#242424" font-size="18" font-weight="800">Kumartuli Park</text>
          <text x="0" y="66" fill="#7E7268" font-size="13" class="bengali">কুমারটুলি পার্ক সার্বজনীন</text>
          <text x="0" y="92" fill="#5C524A" font-size="12">🚇 Sovabazar • 🚶 650m • 👥 Very High</text>
        </g>
      </g>

      <!-- Card 3 -->
      <g transform="translate(0, 652)">
        <rect width="380" height="310" rx="20" fill="#FFFFFF" stroke="#E8E1D9" stroke-width="1"/>
        <rect width="380" height="150" rx="20" fill="#b45309"/>
        <text x="190" y="80" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">Sovabazar Rajbari Photo</text>
        <g transform="translate(16, 168)">
          <rect width="85" height="22" rx="11" fill="#fdeeee"/>
          <text x="42" y="15" fill="#b42323" font-size="10" font-weight="700" text-anchor="middle">Bonedi Bari</text>
          <text x="0" y="44" fill="#242424" font-size="18" font-weight="800">Sovabazar Rajbari</text>
          <text x="0" y="66" fill="#7E7268" font-size="13" class="bengali">শোভাবাজার রাজবাড়ি</text>
          <text x="0" y="92" fill="#5C524A" font-size="12">🚇 Sovabazar • 🚶 400m • 👥 Heritage</text>
        </g>
      </g>
    </g>
  </g>

  
  <!-- Fixed Mobile Bottom Navigation (64px) -->
  <g id="Mobile_Bottom_Nav" transform="translate(0, 2012)">
    <rect width="412" height="64" fill="#FFFFFF"/>
    <line x1="0" y1="0" x2="412" y2="0" stroke="#E8E1D9" stroke-width="1"/>
    
    <g transform="translate(41.2, 14)" text-anchor="middle">
      <text x="0" y="16" font-size="18">🏠</text>
      <text x="0" y="32" fill="#7E7268" font-size="10" font-weight="500">Home</text>
    </g>
    <g transform="translate(123.60000000000001, 14)" text-anchor="middle">
      <text x="0" y="16" font-size="18">🧭</text>
      <text x="0" y="32" fill="#b42323" font-size="10" font-weight="700">Explore</text>
    </g>
    <g transform="translate(206, 14)" text-anchor="middle">
      <text x="0" y="16" font-size="18">🗺️</text>
      <text x="0" y="32" fill="#7E7268" font-size="10" font-weight="500">Map</text>
    </g>
    <g transform="translate(288.40000000000003, 14)" text-anchor="middle">
      <text x="0" y="16" font-size="18">🔀</text>
      <text x="0" y="32" fill="#7E7268" font-size="10" font-weight="500">Planner</text>
    </g>
    <g transform="translate(370.8, 14)" text-anchor="middle">
      <text x="0" y="16" font-size="18">⋯</text>
      <text x="0" y="32" fill="#7E7268" font-size="10" font-weight="500">More</text>
    </g>
  </g>
  
  
  <rect x="0" y="2076" width="412" height="24" fill="#FFFFFF"/>
  <rect x="170" y="2086" width="72" height="4" rx="2" fill="#5a504a"/>
  
</svg>