    <rect width="412" height="60" fill="#fcfaf7" fill-opacity="0.98"/>
    <line x1="0" y1="0" x2="412" y2="0" stroke="#e8e1d9" stroke-width="1"/>
    
      <g transform="translate(0, 4)">
        <rect x="14" y="2" width="54" height="46" rx="12" fill="transparent"/>
        <text x="41" y="22" font-size="16" text-anchor="middle">🏠</text>
        <text x="41" y="40" fill="#625b55" font-size="10" font-weight="500" text-anchor="middle">Home</text>
      </g>
    
      <g transform="translate(82, 4)">
        <rect x="14" y="2" width="54" height="46" rx="12" fill="transparent"/>
        <text x="41" y="22" font-size="16" text-anchor="middle">🔍</text>
        <text x="41" y="40" fill="#625b55" font-size="10" font-weight="500" text-anchor="middle">Explore</text>
      </g>
    
      <g transform="translate(164, 4)">
        <rect x="14" y="2" width="54" height="46" rx="12" fill="transparent"/>
        <text x="41" y="22" font-size="16" text-anchor="middle">📍</text>
        <text x="41" y="40" fill="#625b55" font-size="10" font-weight="500" text-anchor="middle">Map</text>
      </g>
    
      <g transform="translate(246, 4)">
        <rect x="14" y="2" width="54" height="46" rx="12" fill="transparent"/>
        <text x="41" y="22" font-size="16" text-anchor="middle">🔀</text>
        <text x="41" y="40" fill="#625b55" font-size="10" font-weight="500" text-anchor="middle">Planner</text>
      </g>
    
      <g transform="translate(328, 4)">
        <rect x="14" y="2" width="54" height="46" rx="12" fill="#fbe8e6"/>
        <text x="41" y="22" font-size="16" text-anchor="middle">☰</text>
        <text x="41" y="40" fill="#b42323" font-size="10" font-weight="800" text-anchor="middle">More</text>
      </g>
    
  </g>
  
  
  <!-- ANDROID SYSTEM GESTURE NAVIGATION PILL (y=890) -->
  <g id="Android_Gesture_Pill" transform="translate(0, 890)">
    <rect width="412" height="24" fill="none"/>
    <rect x="170" y="10" width="72" height="4" rx="2" fill="#1A1715" fill-opacity="0.8"/>
  </g>
  
