<?xml version="1.0" encoding="UTF-8"?>
<svg width="412" height="1350" viewBox="0 0 412 1350" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&amp;family=Inter:wght@400;500;600;700;800;900&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .bengali { font-family: 'Hind Siliguri', 'Inter', sans-serif; }
      .brand { font-family: 'Inter', sans-serif; font-weight: 900; }
    </style>
  </defs>

  <rect width="412" height="1350" fill="#fcfaf7"/>

  
  <!-- ANDROID SYSTEM STATUS BAR (412 x 40) -->
  <g id="Android_Status_Bar">
    <rect width="412" height="40" fill="#fcfaf7"/>
    <text x="24" y="26" fill="#1a1715" font-size="14" font-weight="600">9:34</text>
    
    <g transform="translate(320, 14)">
      <!-- 5G Badge -->
      <text x="0" y="12" fill="#1a1715" font-size="11" font-weight="700">5G</text>
      <!-- Signal Bars -->
      <path d="M22 18 L22 14 M25 18 L25 10 M28 18 L28 6 M31 18 L31 2" stroke="#1a1715" stroke-width="2" stroke-linecap="round"/>
      <!-- Battery Icon -->
      <rect x="38" y="5" width="18" height="11" rx="3" stroke="#1a1715" stroke-width="1.5" fill="none"/>
      <rect x="40" y="7" width="11" height="7" fill="#1a1715"/>
      <line x1="57" y1="8" x2="57" y2="13" stroke="#1a1715" stroke-width="1.5"/>
    </g>
  </g>
  
  
  <!-- CAPACITOR ANDROID APP BAR (412 x 56, NO INSTALL BUTTON) -->
  <g id="Capacitor_App_Bar" transform="translate(0, 40)">
    <rect width="412" height="56" fill="rgba(252, 250, 247, 0.98)"/>
    <line x1="0" y1="56" x2="412" y2="56" stroke="#eee8e1" stroke-width="1"/>

    <!-- Left Brand Logo -->
    <text x="18" y="36" fill="#b42323" font-size="22" font-weight="900" letter-spacing="-0.5" class="brand">PujoPath</text>

    <!-- Right Controls: Theme Toggle, Language Switcher, Favorites Heart -->
    <g id="Cap_Controls" transform="translate(240, 10)">
      <!-- Moon / Sun Toggle -->
      <g id="Cap_Theme_Toggle">
        <rect width="36" height="36" rx="11" fill="#ffffff" stroke="#e8e1d9" stroke-width="1"/>
        <text x="18" y="23" fill="#5c524a" font-size="14" text-anchor="middle">🌙</text>
      </g>

      <!-- Language Toggle Pill (EN / বাংলা) -->
      <g id="Cap_Lang_Toggle" transform="translate(44, 0)">
        <rect width="68" height="36" rx="11" fill="#ffffff" stroke="#e8e1d9" stroke-width="1"/>
        <rect x="3" y="3" width="30" height="30" rx="8" fill="#b42323"/>
        <text x="18" y="22" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">EN</text>
        <text x="48" y="22" fill="#5c524a" font-size="11" font-weight="600" text-anchor="middle" class="bengali">বাংলা</text>
      </g>

      <!-- Favorites Heart Button -->
      <g id="Cap_Favorites" transform="translate(120, 0)">
        <rect width="36" height="36" rx="11" fill="#ffffff" stroke="#e8e1d9" stroke-width="1"/>
        <text x="18" y="23" fill="#5c524a" font-size="15" text-anchor="middle">♡</text>
      </g>
    </g>
  </g>
  

  <!-- Page Header -->
  <g id="Cap_Feedback_Header" transform="translate(20, 114)">
    <rect width="116" height="24" rx="12" fill="#feeceb"/>
    <text x="58" y="16" fill="#b42323" font-size="10" font-weight="700" text-anchor="middle">💬 FEEDBACK</text>
    <text x="0" y="52" fill="#242424" font-size="26" font-weight="900" letter-spacing="-0.5">Share Your Thoughts</text>
    <text x="0" y="74" fill="#5c524a" font-size="13">Help us improve PujoPath for everyone.</text>

    <!-- Feedback Form Card -->
    <g transform="translate(0, 96)">
      <rect width="372" height="340" rx="20" fill="#ffffff" stroke="#e8e1d9" stroke-width="1"/>
      <g transform="translate(18, 18)">
        <text x="0" y="14" fill="#242424" font-size="14" font-weight="700">What is your feedback about?</text>
        
        <!-- Category Pills -->
        <g transform="translate(0, 26)">
          <rect width="84" height="28" rx="14" fill="#b42323"/>
          <text x="42" y="18" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">General</text>

          <rect x="92" width="94" height="28" rx="14" fill="#f9f6f1" stroke="#e8e1d9" stroke-width="1"/>
          <text x="139" y="18" fill="#242424" font-size="11" font-weight="600" text-anchor="middle">Pandal Info</text>

          <rect x="194" width="76" height="28" rx="14" fill="#f9f6f1" stroke="#e8e1d9" stroke-width="1"/>
          <text x="232" y="18" fill="#242424" font-size="11" font-weight="600" text-anchor="middle">Bug Fix</text>
        </g>

        <!-- Rating Stars -->
        <g transform="translate(0, 76)">
          <text x="0" y="14" fill="#242424" font-size="14" font-weight="700">Rate your experience</text>
          <text x="0" y="38" fill="#d97706" font-size="20">★★★★★</text>
        </g>

        <!-- Input Textarea -->
        <g transform="translate(0, 136)">
          <rect width="336" height="88" rx="12" fill="#ffffff" stroke="#e5e0d8" stroke-width="1"/>
          <text x="14" y="24" fill="#5c524a" font-size="12">Type your feedback, feature ideas, or bug report here...</text>
        </g>

        <!-- Submit Button -->
        <g transform="translate(0, 240)">
          <rect width="336" height="42" rx="12" fill="#b42323"/>
          <text x="168" y="26" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">Submit Feedback →</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Footer -->
  
  <!-- CAPACITOR ANDROID FOOTER -->
  <g transform="translate(18, 1180)">
    <line x1="0" y1="0" x2="376" y2="0" stroke="#e8e1d9" stroke-width="1"/>
    
    <g transform="translate(0, 18)">
      <text x="0" y="16" fill="#b42323" font-size="15" font-weight="900" class="brand">PujoPath</text>
      <text x="78" y="16" fill="#7e7268" font-size="12">Kolkata Durga Puja Companion</text>
      <text x="0" y="36" fill="#8f847b" font-size="11">Explore pandals, plan walking routes, check metro connectivity.</text>

      <g transform="translate(0, 56)">
        <text x="0" y="14" fill="#7e7268" font-size="11">© 2026 PujoPath. All rights reserved.</text>
        <text x="270" y="14" fill="#b42323" font-size="11" font-weight="700">Helpline &amp; About ↗</text>
      </g>

      <g transform="translate(0, 84)">
        <rect width="376" height="32" rx="8" fill="#f9f6f1" stroke="#e8e1d9" stroke-width="1"/>
        <text x="16" y="20" fill="#7e7268" font-size="11">🌸 Festive Pandal &amp; Dhakis  ⏸ Pause</text>
        <text x="360" y="20" fill="#8f847b" font-size="10" text-anchor="end">Made by Soumik &amp; Moumita with ❤️</text>
      </g>
    </g>
  </g>
  

  <!-- Fixed Bottom Navigation + Gesture Pill -->
  
  <!-- CAPACITOR ANDROID BOTTOM NAVIGATION (412 x 64, Y=1262) -->
  <g id="Capacitor_Bottom_Nav" transform="translate(0, 1262)">
    <rect width="412" height="64" fill="#ffffff"/>
    <line x1="0" y1="0" x2="412" y2="0" stroke="#eee8e1" stroke-width="1"/>
    
    <!-- Tab: Home -->
    <g transform="translate(12, 6)">
      
      <g transform="translate(25, 6)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#665a54" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        </svg>
      </g>
      <text x="35" y="37" fill="#665a54" font-size="11" font-weight="600" text-anchor="middle">Home</text>
      
    </g>
    
    <!-- Tab: Explore -->
    <g transform="translate(90, 6)">
      
      <g transform="translate(25, 6)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#665a54" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"></path><circle cx="12" cy="12" r="10"></circle>
        </svg>
      </g>
      <text x="35" y="37" fill="#665a54" font-size="11" font-weight="600" text-anchor="middle">Explore</text>
      
    </g>
    
    <!-- Tab: Map -->
    <g transform="translate(168, 6)">
      
      <g transform="translate(25, 6)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#665a54" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle>
        </svg>
      </g>
      <text x="35" y="37" fill="#665a54" font-size="11" font-weight="600" text-anchor="middle">Map</text>
      
    </g>
    
    <!-- Tab: Planner -->
    <g transform="translate(246, 6)">
      
      <g transform="translate(25, 6)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#665a54" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="19" r="3"></circle><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"></path><circle cx="18" cy="5" r="3"></circle>
        </svg>
      </g>
      <text x="35" y="37" fill="#665a54" font-size="11" font-weight="600" text-anchor="middle">Planner</text>
      
    </g>
    
    <!-- Tab: More -->
    <g transform="translate(324, 6)">
      <rect x="0" y="0" width="70" height="48" rx="12" fill="#fdeeee"/>
      <g transform="translate(25, 6)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b42323" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle><circle cx="5" cy="12" r="1.5"></circle>
        </svg>
      </g>
      <text x="35" y="37" fill="#b42323" font-size="11" font-weight="700" text-anchor="middle">More</text>
      <circle cx="35" cy="44" r="2" fill="#b42323"/>
    </g>
    
  </g>
  
  
  <!-- ANDROID SYSTEM GESTURE NAVIGATION PILL (Y=1326) -->
  <g id="Android_Gesture_Pill" transform="translate(0, 1326)">
    <rect width="412" height="24" fill="none"/>
    <rect x="170" y="10" width="72" height="4" rx="2" fill="#1a1715" fill-opacity="0.8"/>
  </g>
  
</svg>