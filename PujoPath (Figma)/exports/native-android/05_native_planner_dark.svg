<?xml version="1.0" encoding="UTF-8"?>
<svg width="412" height="1500" viewBox="0 0 412 1500" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&amp;family=Inter:wght@400;500;600;700;800;900&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .bengali { font-family: 'Hind Siliguri', 'Inter', sans-serif; }
      .brand { font-family: 'Inter', sans-serif; font-weight: 900; }
    </style>
  </defs>

  <rect width="412" height="1500" fill="#14110e"/>
  
  <!-- ANDROID SYSTEM STATUS BAR (412 x 40) -->
  <g id="Native_Status_Bar">
    <rect width="412" height="40" fill="#14110e"/>
    <text x="24" y="26" fill="#ffffff" font-size="14" font-weight="600">9:10</text>
    
    <g transform="translate(320, 14)">
      <!-- 5G Badge -->
      <text x="0" y="12" fill="#ffffff" font-size="11" font-weight="700">5G</text>
      <!-- Signal Bars -->
      <path d="M22 18 L22 14 M25 18 L25 10 M28 18 L28 6 M31 18 L31 2" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <!-- Battery Icon -->
      <rect x="38" y="5" width="18" height="11" rx="3" stroke="#ffffff" stroke-width="1.5" fill="none"/>
      <rect x="40" y="7" width="11" height="7" fill="#ffffff"/>
      <line x1="57" y1="8" x2="57" y2="13" stroke="#ffffff" stroke-width="1.5"/>
    </g>
  </g>
  
  
  <!-- NATIVE REACT NATIVE APP HEADER (412 x 56) -->
  <g id="Native_Header" transform="translate(0, 40)">
    <rect width="412" height="56" fill="#181411"/>
    <line x1="0" y1="56" x2="412" y2="56" stroke="#2a241f" stroke-width="1"/>

    
    <!-- Brand / Back -->
    <g transform="translate(18, 12)">
      <text x="0" y="26" fill="#b42323" font-size="22" font-weight="900" letter-spacing="-0.5" class="brand">PujoPath</text>
    </g>
  
      <!-- Festival Edition Pill -->
      <g transform="translate(122, 14)">
        <rect width="102" height="28" rx="14" fill="#341b18" stroke="#5a2722" stroke-width="1"/>
        <text x="51" y="19" fill="#fca5a5" font-size="11" font-weight="700" text-anchor="middle">🌸 Durga Puja</text>
      </g>
    

    <!-- Right Controls: Theme Toggle, Language, Heart, Bell -->
    <g id="Native_Controls" transform="translate(200, 10)">
      <!-- Theme Toggle -->
      <g id="Theme_Toggle">
        <rect width="34" height="36" rx="11" fill="#1e1915" stroke="#3d3227" stroke-width="1"/>
        <text x="17" y="23" fill="#d4c7ba" font-size="13" text-anchor="middle">☀️</text>
      </g>

      <!-- Language Pill -->
      <g id="Lang_Pill" transform="translate(40, 0)">
        <rect width="66" height="36" rx="11" fill="#1e1915" stroke="#3d3227" stroke-width="1"/>
        <rect x="2" y="3" width="28" height="30" rx="8" fill="#b42323"/>
        <text x="16" y="22" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle">EN</text>
        <text x="46" y="22" fill="#d4c7ba" font-size="11" font-weight="600" text-anchor="middle" class="bengali">বাংলা</text>
      </g>

      <!-- Favorites Heart with badge -->
      <g id="Favorites_Btn" transform="translate(112, 0)">
        <rect width="36" height="36" rx="11" fill="#1e1915" stroke="#3d3227" stroke-width="1"/>
        <text x="18" y="24" fill="#d4c7ba" font-size="15" text-anchor="middle">♡</text>
        <circle cx="28" cy="8" r="6" fill="#b42323"/>
        <text x="28" y="11" fill="#FFFFFF" font-size="8" font-weight="800" text-anchor="middle">1</text>
      </g>

      <!-- Notification Bell -->
      <g id="Bell_Btn" transform="translate(154, 0)">
        <rect width="36" height="36" rx="11" fill="#1e1915" stroke="#3d3227" stroke-width="1"/>
        <text x="18" y="23" fill="#d4c7ba" font-size="14" text-anchor="middle">🔔</text>
      </g>
    </g>
  </g>
  

  <!-- Optimization Summary Banner -->
  <g transform="translate(16, 106)">
    <rect width="380" height="96" rx="18" fill="#143823" stroke="#86efac" stroke-width="1"/>
    <text x="16" y="28" fill="#15803d" font-size="12" font-weight="800">⚡ TSP HA日內RSINE OPTIMIZER ACTIVE</text>
    <text x="16" y="52" fill="#f8f3ec" font-size="18" font-weight="900">Saved 3.4 km of Walking</text>
    <text x="16" y="74" fill="#d4c7ba" font-size="11">Total Route: 4 Stops • 2.6 km Total Distance • Approx 38 mins walk</text>
  </g>

  <!-- Start Point Selector -->
  <g transform="translate(16, 214)">
    <rect width="380" height="48" rx="14" fill="#1e1915" stroke="#3d3227" stroke-width="1"/>
    <circle cx="24" cy="24" r="8" fill="#22c55e"/>
    <text x="44" y="29" fill="#f8f3ec" font-size="13" font-weight="700">Start: Shyambazar Metro Station (Exit 2)</text>
    <text x="350" y="29" fill="#d4c7ba" font-size="13">▼</text>
  </g>

  <!-- Stop 1: Bagbazar Sarbojanin -->
  <g transform="translate(16, 274)">
    <rect width="380" height="96" rx="16" fill="#1e1915" stroke="#3d3227" stroke-width="1"/>
    <circle cx="28" cy="48" r="14" fill="#b42323"/>
    <text x="28" y="53" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">1</text>
    <text x="54" y="38" fill="#f8f3ec" font-size="15" font-weight="800">Bagbazar Sarbojanin</text>
    <text x="54" y="56" fill="#b42323" font-size="11" font-weight="600" class="bengali">বাগবাজার সর্বজনীন</text>
    <text x="54" y="74" fill="#d4c7ba" font-size="10">North Kolkata • Traditional Ekchala Protima</text>
    <text x="340" y="52" fill="#d4c7ba" font-size="18">☰</text>
  </g>

  <!-- Distance Connector 1 -> 2 -->
  <g transform="translate(44, 370)">
    <line x1="0" y1="0" x2="0" y2="30" stroke="#b42323" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="16" y="20" fill="#b42323" font-size="10" font-weight="700">600m • 8 min walk</text>
  </g>

  <!-- Stop 2: Kumartuli Park -->
  <g transform="translate(16, 400)">
    <rect width="380" height="96" rx="16" fill="#1e1915" stroke="#3d3227" stroke-width="1"/>
    <circle cx="28" cy="48" r="14" fill="#b42323"/>
    <text x="28" y="53" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">2</text>
    <text x="54" y="38" fill="#f8f3ec" font-size="15" font-weight="800">Kumartuli Park</text>
    <text x="54" y="56" fill="#b42323" font-size="11" font-weight="600" class="bengali">কুমোরটুলি পার্ক</text>
    <text x="54" y="74" fill="#d4c7ba" font-size="10">Sculptor Artisan Colony • Architectural Pandal</text>
    <text x="340" y="52" fill="#d4c7ba" font-size="18">☰</text>
  </g>

  <!-- Distance Connector 2 -> 3 -->
  <g transform="translate(44, 496)">
    <line x1="0" y1="0" x2="0" y2="30" stroke="#b42323" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="16" y="20" fill="#b42323" font-size="10" font-weight="700">400m • 5 min walk</text>
  </g>

  <!-- Stop 3: Sovabazar Rajbari -->
  <g transform="translate(16, 526)">
    <rect width="380" height="96" rx="16" fill="#1e1915" stroke="#3d3227" stroke-width="1"/>
    <circle cx="28" cy="48" r="14" fill="#d97706"/>
    <text x="28" y="53" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">3</text>
    <text x="54" y="38" fill="#f8f3ec" font-size="15" font-weight="800">Sovabazar Rajbari</text>
    <text x="54" y="56" fill="#b42323" font-size="11" font-weight="600" class="bengali">শোভাবাজার রাজবাড়ি</text>
    <text x="54" y="74" fill="#d4c7ba" font-size="10">Historic Aristocratic Palace Courtyard</text>
    <text x="340" y="52" fill="#d4c7ba" font-size="18">☰</text>
  </g>

  <!-- Distance Connector 3 -> 4 -->
  <g transform="translate(44, 622)">
    <line x1="0" y1="0" x2="0" y2="30" stroke="#b42323" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="16" y="20" fill="#b42323" font-size="10" font-weight="700">1.6 km • 20 min walk</text>
  </g>

  <!-- Stop 4: College Square -->
  <g transform="translate(16, 652)">
    <rect width="380" height="96" rx="16" fill="#1e1915" stroke="#3d3227" stroke-width="1"/>
    <circle cx="28" cy="48" r="14" fill="#b42323"/>
    <text x="28" y="53" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">4</text>
    <text x="54" y="38" fill="#f8f3ec" font-size="15" font-weight="800">College Square Sarbojanin</text>
    <text x="54" y="56" fill="#b42323" font-size="11" font-weight="600" class="bengali">কলেজ স্কোয়ার</text>
    <text x="54" y="74" fill="#d4c7ba" font-size="10">Historic Water Tank Illumination &amp; Heritage</text>
    <text x="340" y="52" fill="#d4c7ba" font-size="18">☰</text>
  </g>

  <!-- Action CTA Buttons -->
  <g transform="translate(16, 770)">
    <rect width="380" height="46" rx="14" fill="#b42323"/>
    <text x="190" y="28" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">🗺️ Open Turn-by-Turn in Google Maps</text>
  </g>
  <g transform="translate(16, 826)">
    <rect width="380" height="44" rx="14" fill="#1e1915" stroke="#3d3227" stroke-width="1"/>
    <text x="190" y="27" fill="#f8f3ec" font-size="13" font-weight="700" text-anchor="middle">📤 Share Itinerary / Export GPX</text>
  </g>

  <g transform="translate(0, 1412)">
    
  <!-- NATIVE 5-TAB BOTTOM NAVIGATION BAR (Y=0) -->
  <g id="Native_Bottom_Nav" transform="translate(0, 0)">
    <rect width="412" height="64" fill="#181411"/>
    <line x1="0" y1="0" x2="412" y2="0" stroke="#2a241f" stroke-width="1"/>
    
      <!-- Tab: Home -->
      <g transform="translate(0, 0)">
        <rect width="82.4" height="64" fill="none"/>
        <g transform="translate(41.2, 18)">
          <path d="M3 10L12 3L21 10V20C21 20.6 20.6 21 20 21H4C3.4 21 3 20.6 3 20V10Z" fill="none" stroke="#a89e95" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(-12, -12)"/>
        </g>
        <text x="41.2" y="48" fill="#a89e95" font-size="11" font-weight="500" text-anchor="middle">Home</text>
        
      </g>
    
      <!-- Tab: Explore -->
      <g transform="translate(82.4, 0)">
        <rect width="82.4" height="64" fill="none"/>
        <g transform="translate(41.2, 18)">
          <path d="M12 2C6.5 2 2 6.5 2 12C2 17.5 6.5 22 12 22C17.5 22 22 17.5 22 12C22 6.5 17.5 2 12 2ZM16 8L13.5 13.5L8 16L10.5 10.5L16 8Z" fill="none" stroke="#a89e95" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(-12, -12)"/>
        </g>
        <text x="41.2" y="48" fill="#a89e95" font-size="11" font-weight="500" text-anchor="middle">Explore</text>
        
      </g>
    
      <!-- Tab: Map -->
      <g transform="translate(164.8, 0)">
        <rect width="82.4" height="64" fill="none"/>
        <g transform="translate(41.2, 18)">
          <path d="M12 2C8.1 2 5 5.1 5 9C5 14.2 12 22 12 22C12 22 19 14.2 19 9C19 5.1 15.9 2 12 2ZM12 11.5C10.6 11.5 9.5 10.4 9.5 9C9.5 7.6 10.6 6.5 12 6.5C13.4 6.5 14.5 7.6 14.5 9C14.5 10.4 13.4 11.5 12 11.5Z" fill="none" stroke="#a89e95" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(-12, -12)"/>
        </g>
        <text x="41.2" y="48" fill="#a89e95" font-size="11" font-weight="500" text-anchor="middle">Map</text>
        
      </g>
    
      <!-- Tab: Planner -->
      <g transform="translate(247.20000000000002, 0)">
        <rect width="82.4" height="64" fill="none"/>
        <g transform="translate(41.2, 18)">
          <path d="M4 19C4 17.3 5.3 16 7 16H17C18.7 16 20 17.3 20 19M12 4V12M8 8H16" fill="#b42323" stroke="#b42323" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(-12, -12)"/>
        </g>
        <text x="41.2" y="48" fill="#b42323" font-size="11" font-weight="700" text-anchor="middle">Planner</text>
        <circle cx="41.2" cy="56" r="2.5" fill="#b42323"/>
      </g>
    
      <!-- Tab: More -->
      <g transform="translate(329.6, 0)">
        <rect width="82.4" height="64" fill="none"/>
        <g transform="translate(41.2, 18)">
          <path d="M6 12C6 12.5 5.5 13 5 13C4.5 13 4 12.5 4 12C4 11.5 4.5 11 5 11C5.5 11 6 11.5 6 12ZM13 12C13 12.5 12.5 13 12 13C11.5 13 11 12.5 11 12C11 11.5 11.5 11 12 11C12.5 11 13 11.5 13 12ZM20 12C20 12.5 19.5 13 19 13C18.5 13 18 12.5 18 12C18 11.5 18.5 11 19 11C19.5 11 20 11.5 20 12Z" fill="none" stroke="#a89e95" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(-12, -12)"/>
        </g>
        <text x="41.2" y="48" fill="#a89e95" font-size="11" font-weight="500" text-anchor="middle">More</text>
        
      </g>
    
  </g>
  
    
  <!-- ANDROID SYSTEM GESTURE NAVIGATION PILL (Y=64) -->
  <g id="Native_Gesture_Pill" transform="translate(0, 64)">
    <rect width="412" height="24" fill="none"/>
    <rect x="170" y="10" width="72" height="4" rx="2" fill="#ffffff" fill-opacity="0.8"/>
  </g>
  
  </g>
</svg>