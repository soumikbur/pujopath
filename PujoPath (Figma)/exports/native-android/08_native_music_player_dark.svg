        <text x="65" y="17" fill="#d4c7ba" font-size="10" text-anchor="middle">Bengali Festive Music</text>
      </g>
    </g>
  </g>

  <!-- Track 1 -->
  <g transform="translate(16, 404)">
    <rect width="380" height="96" rx="16" fill="#1e1915" stroke="#3d3227" stroke-width="1"/>
    <circle cx="34" cy="48" r="18" fill="#341b18"/>
    <text x="34" y="53" fill="#b42323" font-size="14" text-anchor="middle">▶</text>
    <text x="68" y="38" fill="#f8f3ec" font-size="14" font-weight="800">Sharodiya Dhak Dhwoni &amp; Kashi Bol</text>
    <text x="68" y="56" fill="#d4c7ba" font-size="11">Mamta Jagdish Dhody • Dhak &amp; Shankha</text>
    <text x="330" y="38" fill="#b42323" font-size="11" font-weight="700">01:39</text>
    <g transform="translate(68, 68)">
      <text x="0" y="14" fill="#786e65" font-size="9">CC BY-SA 4.0</text>
      <text x="140" y="14" fill="#0284c7" font-size="9" font-weight="600">Direct Audio ↗</text>
    </g>
  </g>

  <!-- Track 2 -->
  <g transform="translate(16, 510)">
    <rect width="380" height="96" rx="16" fill="#1e1915" stroke="#3d3227" stroke-width="1"/>
    <circle cx="34" cy="48" r="18" fill="#341b18"/>
    <text x="34" y="53" fill="#b42323" font-size="14" text-anchor="middle">▶</text>
    <text x="68" y="38" fill="#f8f3ec" font-size="14" font-weight="800">Sacred Shankha Naad (Auspicious Conch)</text>
    <text x="68" y="56" fill="#d4c7ba" font-size="11">David Bolton • Dhak &amp; Shankha</text>
    <text x="330" y="38" fill="#b42323" font-size="11" font-weight="700">00:07</text>
    <g transform="translate(68, 68)">
      <text x="0" y="14" fill="#786e65" font-size="9">CC BY 2.5</text>
      <text x="140" y="14" fill="#0284c7" font-size="9" font-weight="600">Direct Audio ↗</text>
    </g>
  </g>

  <!-- Track 3 -->
  <g transform="translate(16, 616)">
    <rect width="380" height="96" rx="16" fill="#1e1915" stroke="#3d3227" stroke-width="1"/>
    <circle cx="34" cy="48" r="18" fill="#341b18"/>
    <text x="34" y="53" fill="#b42323" font-size="14" text-anchor="middle">▶</text>
    <text x="68" y="38" fill="#f8f3ec" font-size="14" font-weight="800">Dhunuchi Naach Dhak Taali &amp; Kaashor</text>
    <text x="68" y="56" fill="#d4c7ba" font-size="11">Traditional Bengali Dhaki Ensemble</text>
    <text x="330" y="38" fill="#b42323" font-size="11" font-weight="700">04:00</text>
    <g transform="translate(68, 68)">
      <text x="0" y="14" fill="#786e65" font-size="9">Authorized Stream</text>
      <text x="140" y="14" fill="#0284c7" font-size="9" font-weight="600">Direct Audio ↗</text>
    </g>
  </g>

  <g transform="translate(0, 1262)">
    
