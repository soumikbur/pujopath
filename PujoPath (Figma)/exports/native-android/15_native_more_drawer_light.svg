<?xml version="1.0" encoding="UTF-8"?>
<svg width="412" height="915" viewBox="0 0 412 915" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&amp;family=Inter:wght@400;500;600;700;800;900&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .bengali { font-family: 'Hind Siliguri', 'Inter', sans-serif; }
      .brand { font-family: 'Inter', sans-serif; font-weight: 900; }
    </style>
  </defs>

  <!-- Dark Backdrop -->
  <rect width="412" height="915" fill="black" fill-opacity="0.6"/>
  
  <!-- ANDROID SYSTEM STATUS BAR (412 x 40) -->
  <g id="Native_Status_Bar">
    <rect width="412" height="40" fill="none"/>
    <text x="24" y="26" fill="#FFFFFF" font-size="14" font-weight="600">9:10</text>
    
    <g transform="translate(320, 14)">
      <!-- 5G Badge -->
      <text x="0" y="12" fill="#FFFFFF" font-size="11" font-weight="700">5G</text>
      <!-- Signal Bars -->
      <path d="M22 18 L22 14 M25 18 L25 10 M28 18 L28 6 M31 18 L31 2" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <!-- Battery Icon -->
      <rect x="38" y="5" width="18" height="11" rx="3" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
      <rect x="40" y="7" width="11" height="7" fill="#FFFFFF"/>
      <line x1="57" y1="8" x2="57" y2="13" stroke="#FFFFFF" stroke-width="1.5"/>
    </g>
  </g>
  

  <!-- Drawer Surface -->
  <g transform="translate(0, 160)">
    <rect width="412" height="755" rx="24" fill="#ffffff"/>
    <line x1="186" y1="12" x2="226" y2="12" stroke="#e8e1d9" stroke-width="4" stroke-linecap="round"/>

    <text x="24" y="44" fill="#242424" font-size="18" font-weight="900">Explore More Features</text>
    <text x="24" y="64" fill="#5c524a" font-size="11">Festival tools, transit schedules, and developer info</text>

    <!-- Menu List -->
    <!-- Item 1: Calendar -->
    <g transform="translate(24, 84)">
      <rect width="364" height="48" rx="12" fill="#f9f6f1"/>
      <text x="16" y="30" fill="#b42323" font-size="15">📅</text>
      <text x="44" y="30" fill="#242424" font-size="13" font-weight="700">Calendar &amp; Tithi Almanac</text>
      <text x="340" y="30" fill="#5c524a" font-size="14">→</text>
    </g>

    <!-- Item 2: Metro Guide -->
    <g transform="translate(24, 140)">
      <rect width="364" height="48" rx="12" fill="#f9f6f1"/>
      <text x="16" y="30" fill="#2563eb" font-size="15">🚇</text>
      <text x="44" y="30" fill="#242424" font-size="13" font-weight="700">Kolkata Metro Timetables</text>
      <text x="340" y="30" fill="#5c524a" font-size="14">→</text>
    </g>

    <!-- Item 3: Puja Music -->
    <g transform="translate(24, 196)">
      <rect width="364" height="48" rx="12" fill="#f9f6f1"/>
      <text x="16" y="30" fill="#9333ea" font-size="15">🎵</text>
      <text x="44" y="30" fill="#242424" font-size="13" font-weight="700">Sharodiya Soundscapes</text>
      <text x="340" y="30" fill="#5c524a" font-size="14">→</text>
    </g>

    <!-- Item 4: Mahalaya -->
    <g transform="translate(24, 252)">
      <rect width="364" height="48" rx="12" fill="#f9f6f1"/>
      <text x="16" y="30" fill="#ca8a04" font-size="15">✨</text>
      <text x="44" y="30" fill="#242424" font-size="13" font-weight="700">Mahalaya Broadcast (1931)</text>
      <text x="340" y="30" fill="#5c524a" font-size="14">→</text>
    </g>

    <!-- Item 5: Kali Puja Guide -->
    <g transform="translate(24, 308)">
      <rect width="364" height="48" rx="12" fill="#f9f6f1"/>
      <text x="16" y="30" fill="#6b21a8" font-size="15">🪔</text>
      <text x="44" y="30" fill="#242424" font-size="13" font-weight="700">Kali Puja 2026 Special</text>
      <text x="340" y="30" fill="#5c524a" font-size="14">→</text>
    </g>

    <!-- Item 6: Emergency Helplines -->
    <g transform="translate(24, 364)">
      <rect width="364" height="48" rx="12" fill="#f9f6f1"/>
      <text x="16" y="30" fill="#b42323" font-size="15">🚨</text>
      <text x="44" y="30" fill="#242424" font-size="13" font-weight="700">Emergency Helplines</text>
      <text x="340" y="30" fill="#5c524a" font-size="14">→</text>
    </g>

    <!-- Item 7: Meet Developers -->
    <g transform="translate(24, 420)">
      <rect width="364" height="48" rx="12" fill="#f9f6f1"/>
      <text x="16" y="30" fill="#0284c7" font-size="15">👥</text>
      <text x="44" y="30" fill="#242424" font-size="13" font-weight="700">Meet Developers (Moumita &amp; Soumik)</text>
      <text x="340" y="30" fill="#5c524a" font-size="14">→</text>
    </g>

    <!-- Switch Festival Pill Button -->
    <g transform="translate(24, 490)">
      <rect width="364" height="46" rx="14" fill="#feeceb" stroke="#fca5a5" stroke-width="1"/>
      <text x="182" y="28" fill="#b42323" font-size="12" font-weight="800" text-anchor="middle">🔄 Switch Festival: Durga Puja / Kali Puja</text>
    </g>

    <text x="206" y="560" fill="#8f847b" font-size="10" text-anchor="middle">PujoPath Native v1.2.0 (React Native + Hermes)</text>
  </g>

  
  <!-- ANDROID SYSTEM GESTURE NAVIGATION PILL (Y=891) -->
  <g id="Native_Gesture_Pill" transform="translate(0, 891)">
    <rect width="412" height="24" fill="none"/>
    <rect x="170" y="10" width="72" height="4" rx="2" fill="#1a1715" fill-opacity="0.8"/>
  </g>
  
</svg>