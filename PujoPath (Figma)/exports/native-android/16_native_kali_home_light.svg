<?xml version="1.0" encoding="UTF-8"?>
<svg width="412" height="915" viewBox="0 0 412 915" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&amp;family=Inter:wght@400;500;600;700;800;900&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .bengali { font-family: 'Hind Siliguri', 'Inter', sans-serif; }
      .brand { font-family: 'Inter', sans-serif; font-weight: 900; }
    </style>
  </defs>

  <rect width="412" height="915" fill="#faf5ff"/>
  
  <!-- ANDROID SYSTEM STATUS BAR (412 x 40) -->
  <g id="Native_Status_Bar">
    <rect width="412" height="40" fill="#fcfaf7"/>
    <text x="24" y="26" fill="#1a1715" font-size="14" font-weight="600">9:10</text>
    
    <g transform="translate(320, 14)">
      <!-- 5G Badge -->
      <text x="0" y="12" fill="#1a1715" font-size="11" font-weight="700">5G</text>
      <!-- Signal Bars -->
      <path d="M22 18 L22 14 M25 18 L25 10 M28 18 L28 6 M31 18 L31 2" stroke="#1a1715" stroke-width="2" stroke-linecap="round"/>
      <!-- Battery Icon -->
      <rect x="38" y="5" width="18" height="11" rx="3" stroke="#1a1715" stroke-width="1.5" fill="none"/>
      <rect x="40" y="7" width="11" height="7" fill="#1a1715"/>
      <line x1="57" y1="8" x2="57" y2="13" stroke="#1a1715" stroke-width="1.5"/>
    </g>
  </g>
  
  
  <!-- NATIVE REACT NATIVE APP HEADER (412 x 56) -->
  <g id="Native_Header" transform="translate(0, 40)">
    <rect width="412" height="56" fill="#ffffff"/>
    <line x1="0" y1="56" x2="412" y2="56" stroke="#eee8e1" stroke-width="1"/>

    
    <!-- Brand / Back -->
    <g transform="translate(18, 12)">
      <text x="0" y="26" fill="#b42323" font-size="22" font-weight="900" letter-spacing="-0.5" class="brand">PujoPath</text>
    </g>
  
      <!-- Festival Edition Pill -->
      <g transform="translate(122, 14)">
        <rect width="102" height="28" rx="14" fill="#feeceb" stroke="#fca5a5" stroke-width="1"/>
        <text x="51" y="19" fill="#b42323" font-size="11" font-weight="700" text-anchor="middle">🔥 Kali Puja</text>
      </g>
    

    <!-- Right Controls: Theme Toggle, Language, Heart, Bell -->
    <g id="Native_Controls" transform="translate(200, 10)">
      <!-- Theme Toggle -->
      <g id="Theme_Toggle">
        <rect width="34" height="36" rx="11" fill="#ffffff" stroke="#e8e1d9" stroke-width="1"/>
        <text x="17" y="23" fill="#5c524a" font-size="13" text-anchor="middle">🌙</text>
      </g>

      <!-- Language Pill -->
      <g id="Lang_Pill" transform="translate(40, 0)">
        <rect width="66" height="36" rx="11" fill="#ffffff" stroke="#e8e1d9" stroke-width="1"/>
        <rect x="2" y="3" width="28" height="30" rx="8" fill="#b42323"/>
        <text x="16" y="22" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle">EN</text>
        <text x="46" y="22" fill="#5c524a" font-size="11" font-weight="600" text-anchor="middle" class="bengali">বাংলা</text>
      </g>

      <!-- Favorites Heart with badge -->
      <g id="Favorites_Btn" transform="translate(112, 0)">
        <rect width="36" height="36" rx="11" fill="#ffffff" stroke="#e8e1d9" stroke-width="1"/>
        <text x="18" y="24" fill="#5c524a" font-size="15" text-anchor="middle">♡</text>
        <circle cx="28" cy="8" r="6" fill="#b42323"/>
        <text x="28" y="11" fill="#FFFFFF" font-size="8" font-weight="800" text-anchor="middle">1</text>
      </g>

      <!-- Notification Bell -->
      <g id="Bell_Btn" transform="translate(154, 0)">
        <rect width="36" height="36" rx="11" fill="#ffffff" stroke="#e8e1d9" stroke-width="1"/>
        <text x="18" y="23" fill="#5c524a" font-size="14" text-anchor="middle">🔔</text>
      </g>
    </g>
  </g>
  

  <!-- Hero Card: Dipanwita Amavasya -->
  <g transform="translate(16, 110)">
    <rect width="380" height="220" rx="20" fill="#ffffff" stroke="#d8b4fe" stroke-width="1"/>
    <g transform="translate(20, 20)">
      <rect width="138" height="22" rx="11" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1"/>
      <text x="69" y="15" fill="#6b21a8" font-size="10" font-weight="700" text-anchor="middle">🪔 Dipanwita Amavasya</text>
    </g>
    <text x="20" y="74" fill="#242424" font-size="22" font-weight="900">Shyama Puja 2026</text>
    <text x="20" y="98" fill="#5c524a" font-size="12">Explore 33 historic Shaktipeeths, Barasat illuminations, and sacred Shyama Sangeet.</text>

    <g transform="translate(20, 136)">
      <rect width="340" height="42" rx="14" fill="#6b21a8"/>
      <text x="170" y="26" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">Explore 33 Kali Pandals →</text>
    </g>
  </g>

  <!-- Shaktipeeths Highlights -->
  <text x="20" y="360" fill="#242424" font-size="16" font-weight="800">Historic Shaktipeeths &amp; Mandirs</text>

  <!-- Grid of 4 Sacred Temples -->
  <g transform="translate(16, 376)">
    <!-- Kalighat -->
    <rect width="184" height="90" rx="16" fill="#ffffff" stroke="#e8e1d9" stroke-width="1"/>
    <text x="16" y="32" fill="#242424" font-size="14" font-weight="800">Kalighat Temple</text>
    <text x="16" y="50" fill="#6b21a8" font-size="11" font-weight="700">Maha Shaktipeeth</text>
    <text x="16" y="68" fill="#5c524a" font-size="10">South Kolkata • 51 Peethas</text>

    <!-- Dakshineswar -->
    <g transform="translate(196, 0)">
      <rect width="184" height="90" rx="16" fill="#ffffff" stroke="#e8e1d9" stroke-width="1"/>
      <text x="16" y="32" fill="#242424" font-size="14" font-weight="800">Dakshineswar</text>
      <text x="16" y="50" fill="#6b21a8" font-size="11" font-weight="700">Bhavatarini Mandir</text>
      <text x="16" y="68" fill="#5c524a" font-size="10">Rani Rashmoni Heritage</text>
    </g>
  </g>

  <g transform="translate(16, 476)">
    <!-- Barasat Pioneer -->
    <rect width="184" height="90" rx="16" fill="#ffffff" stroke="#e8e1d9" stroke-width="1"/>
    <text x="16" y="32" fill="#242424" font-size="14" font-weight="800">Pioneer Athletic</text>
    <text x="16" y="50" fill="#d97706" font-size="11" font-weight="700">Barasat Mega Pandal</text>
    <text x="16" y="68" fill="#5c524a" font-size="10">Grand Illumination &amp; Theme</text>

    <!-- Boro Maa Naihati -->
    <g transform="translate(196, 0)">
      <rect width="184" height="90" rx="16" fill="#ffffff" stroke="#e8e1d9" stroke-width="1"/>
      <text x="16" y="32" fill="#242424" font-size="14" font-weight="800">Boro Maa Naihati</text>
      <text x="16" y="50" fill="#d97706" font-size="11" font-weight="700">Historic 21ft Idol</text>
      <text x="16" y="68" fill="#5c524a" font-size="10">Over 100 Years of Devotion</text>
    </g>
  </g>

  <!-- Barasat Kali Festival Banner -->
  <g transform="translate(16, 580)">
    <rect width="380" height="80" rx="16" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1"/>
    <text x="16" y="30" fill="#6b21a8" font-size="11" font-weight="800">✨ BARASAT KALI FESTIVAL ZONE</text>
    <text x="16" y="50" fill="#242424" font-size="13" font-weight="700">18 Celebrated Pandals with World-Class Lighting</text>
    <text x="16" y="66" fill="#5c524a" font-size="10">KNC Regiment • Pioneer • Nabapally Boys • Sandhani</text>
  </g>

  <!-- Floating Audio Miniplayer (Shyama Sangeet) -->
  <g transform="translate(16, 762)">
    <rect width="380" height="52" rx="14" fill="#ffffff" stroke="#e8e1d9" stroke-width="1"/>
    <rect x="8" y="8" width="36" height="36" rx="8" fill="#6b21a8"/>
    <text x="26" y="31" fill="#FFFFFF" font-size="16" text-anchor="middle">🪔</text>
    <text x="52" y="26" fill="#242424" font-size="12" font-weight="700">Mayer Paayer Jaba Hoye (মাগো আনন্দময়ী)</text>
    <text x="52" y="40" fill="#6b21a8" font-size="10" font-weight="600">Pannalal Bhattacharya • Shyama Sangeet</text>
    <circle cx="352" cy="26" r="14" fill="#6b21a8"/>
    <path d="M350 20L356 26L350 32Z" fill="#FFFFFF"/>
  </g>

  
