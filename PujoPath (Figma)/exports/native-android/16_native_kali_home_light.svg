        <rect width="82.4" height="64" fill="none"/>
        <g transform="translate(41.2, 18)">
          <path d="M12 2C6.5 2 2 6.5 2 12C2 17.5 6.5 22 12 22C17.5 22 22 17.5 22 12C22 6.5 17.5 2 12 2ZM16 8L13.5 13.5L8 16L10.5 10.5L16 8Z" fill="none" stroke="#665a54" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(-12, -12)"/>
        </g>
        <text x="41.2" y="48" fill="#665a54" font-size="11" font-weight="500" text-anchor="middle">Explore</text>
        
      </g>
    
      <!-- Tab: Map -->
      <g transform="translate(164.8, 0)">
        <rect width="82.4" height="64" fill="none"/>
        <g transform="translate(41.2, 18)">
          <path d="M12 2C8.1 2 5 5.1 5 9C5 14.2 12 22 12 22C12 22 19 14.2 19 9C19 5.1 15.9 2 12 2ZM12 11.5C10.6 11.5 9.5 10.4 9.5 9C9.5 7.6 10.6 6.5 12 6.5C13.4 6.5 14.5 7.6 14.5 9C14.5 10.4 13.4 11.5 12 11.5Z" fill="none" stroke="#665a54" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(-12, -12)"/>
        </g>
        <text x="41.2" y="48" fill="#665a54" font-size="11" font-weight="500" text-anchor="middle">Map</text>
        
      </g>
    
      <!-- Tab: Planner -->
      <g transform="translate(247.20000000000002, 0)">
        <rect width="82.4" height="64" fill="none"/>
        <g transform="translate(41.2, 18)">
          <path d="M4 19C4 17.3 5.3 16 7 16H17C18.7 16 20 17.3 20 19M12 4V12M8 8H16" fill="none" stroke="#665a54" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(-12, -12)"/>
        </g>
        <text x="41.2" y="48" fill="#665a54" font-size="11" font-weight="500" text-anchor="middle">Planner</text>
        
      </g>
    
      <!-- Tab: More -->
      <g transform="translate(329.6, 0)">
        <rect width="82.4" height="64" fill="none"/>
        <g transform="translate(41.2, 18)">
          <path d="M6 12C6 12.5 5.5 13 5 13C4.5 13 4 12.5 4 12C4 11.5 4.5 11 5 11C5.5 11 6 11.5 6 12ZM13 12C13 12.5 12.5 13 12 13C11.5 13 11 12.5 11 12C11 11.5 11.5 11 12 11C12.5 11 13 11.5 13 12ZM20 12C20 12.5 19.5 13 19 13C18.5 13 18 12.5 18 12C18 11.5 18.5 11 19 11C19.5 11 20 11.5 20 12Z" fill="none" stroke="#665a54" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(-12, -12)"/>
        </g>
        <text x="41.2" y="48" fill="#665a54" font-size="11" font-weight="500" text-anchor="middle">More</text>
        
      </g>
    
  </g>
  
  
  <!-- ANDROID SYSTEM GESTURE NAVIGATION PILL (Y=891) -->
  <g id="Native_Gesture_Pill" transform="translate(0, 891)">
    <rect width="412" height="24" fill="none"/>
    <rect x="170" y="10" width="72" height="4" rx="2" fill="#1a1715" fill-opacity="0.8"/>
  </g>
  
</svg>