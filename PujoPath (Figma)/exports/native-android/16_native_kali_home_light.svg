    <rect width="412" height="64" fill="#ffffff"/>
    <line x1="0" y1="0" x2="412" y2="0" stroke="#eee8e1" stroke-width="1"/>
    
      <!-- Tab: Home -->
      <g transform="translate(0, 0)">
        <rect width="82.4" height="64" fill="none"/>
        <g transform="translate(41.2, 18)">
          <path d="M3 10L12 3L21 10V20C21 20.6 20.6 21 20 21H4C3.4 21 3 20.6 3 20V10Z" fill="#b42323" stroke="#b42323" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(-12, -12)"/>
        </g>
        <text x="41.2" y="48" fill="#b42323" font-size="11" font-weight="700" text-anchor="middle">Home</text>
        <circle cx="41.2" cy="56" r="2.5" fill="#b42323"/>
      </g>
    
      <!-- Tab: Explore -->
