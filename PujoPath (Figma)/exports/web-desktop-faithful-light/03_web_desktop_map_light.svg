
<svg width="1440" height="1000" viewBox="0 0 1440 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&amp;family=Inter:wght@400;500;600;700;800;900&amp;display=swap');
      text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .bengali { font-family: 'Hind Siliguri', 'Inter', sans-serif; }
    </style>
    <radialGradient id="vignetteLight" cx="50%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#fcfaf7" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#fcfaf7" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#fcfaf7" stop-opacity="0.96"/>
    </radialGradient>
    <linearGradient id="cardGradLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#faf8f5"/>
    </linearGradient>
    <linearGradient id="redBannerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#961c1c"/>
      <stop offset="100%" stop-color="#4a1212"/>
    </linearGradient>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#4a3b32" flood-opacity="0.05"/>
    </filter>
  </defs>

  
  <!-- BACKGROUND LIGHT WITH WARM CREAM -->
  <g id="Page_Background_Light">
    <rect width="1440" height="1000" fill="#fcfaf7"/>
  </g>
  
  
  <!-- HEADER LIGHT (Height: 65px) -->
  <g id="Header_Desktop_Light">
    <rect width="1440" height="65" fill="#ffffff" fill-opacity="0.88"/>
    <line x1="0" y1="65" x2="1440" y2="65" stroke="#eee8e1" stroke-width="1"/>

    <g transform="translate(144, 0)">
      <!-- Logo -->
      <text x="0" y="41" fill="#b42323" font-size="20" font-weight="800" letter-spacing="-0.3">PujoPath</text>
      
      <!-- Nav items -->
      
      <g transform="translate(340, 13)">
        <rect width="78" height="38" rx="12" fill="transparent"/>
        <text x="39" y="24" fill="#57524c" font-size="14" font-weight="700" text-anchor="middle">Explore</text>
      </g>
    
      <g transform="translate(426, 13)">
        <rect width="78" height="38" rx="12" fill="#f5efe6"/>
        <text x="39" y="24" fill="#1a1715" font-size="14" font-weight="700" text-anchor="middle">Map</text>
      </g>
    
      <g transform="translate(512, 13)">
        <rect width="78" height="38" rx="12" fill="transparent"/>
        <text x="39" y="24" fill="#57524c" font-size="14" font-weight="700" text-anchor="middle">Plan</text>
      </g>
    
      <g transform="translate(598, 13)">
        <rect width="78" height="38" rx="12" fill="transparent"/>
        <text x="39" y="24" fill="#57524c" font-size="14" font-weight="700" text-anchor="middle">More ⌵</text>
      </g>
    

      <!-- Right Actions: Install App, Mode, Lang, Saved -->
      <g transform="translate(740, 13)">
        <!-- Install App -->
        <g id="Btn_Install_App">
          <rect width="124" height="38" rx="12" fill="#b42323"/>
          <text x="22" y="24" fill="#ffffff" font-size="14">📥</text>
          <text x="44" y="24" fill="#ffffff" font-size="14" font-weight="700">Install App</text>
        </g>
        <!-- Theme Toggle (Moon icon in light mode) -->
        <g id="Btn_Theme_Toggle" transform="translate(136, 0)">
          <rect width="38" height="38" rx="12" fill="#ffffff" stroke="#eee8e1" stroke-width="1"/>
          <text x="19" y="24" fill="#57524c" font-size="15" text-anchor="middle">🌙</text>
        </g>
        <!-- Lang Pill -->
        <g id="Pill_Lang_Toggle" transform="translate(186, 0)">
          <rect width="88" height="38" rx="12" fill="#ffffff" stroke="#eee8e1" stroke-width="1"/>
          <!-- Active EN -->
          <rect x="4" y="4" width="38" height="30" rx="8" fill="#b42323"/>
          <text x="23" y="23" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">EN</text>
          <!-- Inactive বাংলা -->
          <text x="63" y="23" fill="#57524c" font-size="12" font-weight="700" text-anchor="middle" class="bengali">বাংলা</text>
        </g>
        <!-- Saved Heart -->
        <g id="Btn_Saved_Trails" transform="translate(286, 0)">
          <rect width="38" height="38" rx="12" fill="#ffffff" stroke="#eee8e1" stroke-width="1"/>
          <text x="19" y="24" fill="#57524c" font-size="15" text-anchor="middle">♡</text>
        </g>
      </g>
    </g>
  </g>
  

  <g transform="translate(144, 80)">
    <!-- Zone Filter Bar (w: 1152) -->
    <g id="Map_Zone_Filter_Bar">
      <rect x="0" y="0" width="60" height="34" rx="10" fill="#b42323"/>
      <text x="30" y="22" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">All</text>

      <rect x="68" y="0" width="112" height="34" rx="10" fill="#ffffff" stroke="#eee8e1" stroke-width="1"/>
      <text x="124" y="22" fill="#1a1715" font-size="12" font-weight="600" text-anchor="middle">🏛 Bonedi Bari</text>

      <rect x="188" y="0" width="104" height="34" rx="10" fill="#ffffff" stroke="#eee8e1" stroke-width="1"/>
      <text x="240" y="22" fill="#1a1715" font-size="12" font-weight="600" text-anchor="middle">North Kolkata</text>

      <rect x="300" y="0" width="104" height="34" rx="10" fill="#ffffff" stroke="#eee8e1" stroke-width="1"/>
      <text x="352" y="22" fill="#1a1715" font-size="12" font-weight="600" text-anchor="middle">South Kolkata</text>

      <rect x="412" y="0" width="112" height="34" rx="10" fill="#ffffff" stroke="#eee8e1" stroke-width="1"/>
      <text x="468" y="22" fill="#1a1715" font-size="12" font-weight="600" text-anchor="middle">Central Kolkata</text>

      <rect x="532" y="0" width="80" height="34" rx="10" fill="#ffffff" stroke="#eee8e1" stroke-width="1"/>
      <text x="572" y="22" fill="#1a1715" font-size="12" font-weight="600" text-anchor="middle">Salt Lake</text>

      <rect x="620" y="0" width="80" height="34" rx="10" fill="#ffffff" stroke="#eee8e1" stroke-width="1"/>
      <text x="660" y="22" fill="#1a1715" font-size="12" font-weight="600" text-anchor="middle">Dum Dum</text>

      <rect x="708" y="0" width="70" height="34" rx="10" fill="#ffffff" stroke="#eee8e1" stroke-width="1"/>
      <text x="743" y="22" fill="#1a1715" font-size="12" font-weight="600" text-anchor="middle">Behala</text>

      <rect x="786" y="0" width="76" height="34" rx="10" fill="#ffffff" stroke="#eee8e1" stroke-width="1"/>
      <text x="824" y="22" fill="#1a1715" font-size="12" font-weight="600" text-anchor="middle">Howrah</text>

      <rect x="870" y="0" width="104" height="34" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <text x="922" y="22" fill="#b42323" font-size="12" font-weight="700" text-anchor="middle">🚇 Metro Lines</text>
    </g>

    <!-- Vector Map Container (w: 1152, h: 630) -->
    <g id="Interactive_Vector_Map_Light" transform="translate(0, 48)">
      <rect width="1152" height="630" rx="22" fill="#f4efe6" stroke="#eee8e1" stroke-width="1.5"/>

      <!-- Hooghly River Flow in soft blue -->
      <path d="M 280,0 Q 290,120 260,240 T 290,480 T 240,630" fill="none" stroke="#bfdbfe" stroke-width="54" stroke-linecap="round"/>
      <text x="280" y="340" fill="#3b82f6" font-size="12" font-style="italic" font-weight="600" transform="rotate(-82, 280, 340)">Hooghly River (Ganga)</text>

      <!-- Road Networks (White major roads, light orange expressways) -->
      <path d="M 0,260 L 1152,240" stroke="#fed7aa" stroke-width="6"/>
      <path d="M 0,420 L 1152,430" stroke="#ffffff" stroke-width="7"/>
      <path d="M 380,0 L 410,630" stroke="#ffffff" stroke-width="8"/>
      <path d="M 640,0 L 610,630" stroke="#fed7aa" stroke-width="7"/>
      <path d="M 880,0 L 890,630" stroke="#ffffff" stroke-width="6"/>

      <!-- Metro Line (Blue Line North-South & Green Line East-West) -->
      <path d="M 395,0 L 415,630" stroke="#2563eb" stroke-width="4" stroke-dasharray="10 5"/>
      <path d="M 120,290 L 980,280" stroke="#16a34a" stroke-width="4" stroke-dasharray="10 5"/>

      <!-- Kolkata Regional Labels -->
      <text x="180" y="240" fill="#64748b" font-size="13" font-weight="700">Howrah</text>
      <text x="440" y="90" fill="#64748b" font-size="13" font-weight="700">North Kolkata</text>
      <text x="440" y="320" fill="#64748b" font-size="13" font-weight="700">Central Kolkata</text>
      <text x="440" y="520" fill="#64748b" font-size="13" font-weight="700">South Kolkata</text>
      <text x="820" y="220" fill="#64748b" font-size="13" font-weight="700">Salt Lake Sector V</text>

      <!-- Pandal Pin Clusters (Red circular pins with gold count) -->
      <g id="Pandal_Pin_1" transform="translate(420, 110)">
        <circle cx="0" cy="0" r="18" fill="#b42323" stroke="#ffffff" stroke-width="2.5"/>
        <text x="0" y="5" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">128</text>
      </g>
      <g id="Pandal_Pin_2" transform="translate(440, 270)">
        <circle cx="0" cy="0" r="18" fill="#b42323" stroke="#ffffff" stroke-width="2.5"/>
        <text x="0" y="5" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">84</text>
      </g>
      <g id="Pandal_Pin_3" transform="translate(450, 480)">
        <circle cx="0" cy="0" r="22" fill="#b42323" stroke="#ffffff" stroke-width="3"/>
        <text x="0" y="5" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">246</text>
      </g>
      <g id="Pandal_Pin_4" transform="translate(800, 240)">
        <circle cx="0" cy="0" r="16" fill="#b42323" stroke="#ffffff" stroke-width="2.5"/>
        <text x="0" y="5" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">42</text>
      </g>
      <g id="Pandal_Pin_5" transform="translate(320, 160)">
        <circle cx="0" cy="0" r="14" fill="#b42323" stroke="#ffffff" stroke-width="2"/>
        <text x="0" y="4" fill="#ffffff" font-size="9" font-weight="800" text-anchor="middle">19</text>
      </g>

      <!-- Map Controls (Zoom buttons) -->
      <g transform="translate(24, 24)">
        <rect width="36" height="72" rx="10" fill="#ffffff" stroke="#eee8e1" stroke-width="1"/>
        <text x="18" y="27" fill="#1a1715" font-size="18" font-weight="700" text-anchor="middle">+</text>
        <line x1="6" y1="36" x2="30" y2="36" stroke="#eee8e1" stroke-width="1"/>
        <text x="18" y="58" fill="#1a1715" font-size="18" font-weight="700" text-anchor="middle">−</text>
      </g>

      <!-- Sticky bottom bar -->
      <g transform="translate(100, 552)">
        <rect width="952" height="54" rx="16" fill="#ffffff" stroke="#eee8e1" stroke-width="1" filter="url(#softShadow)"/>
        <rect x="14" y="11" width="32" height="32" rx="10" fill="#feeceb"/>
        <text x="30" y="32" fill="#b42323" font-size="14" text-anchor="middle">🧭</text>
        <text x="56" y="28" fill="#1a1715" font-size="13" font-weight="700">0 Pandals Selected</text>
        <text x="56" y="43" fill="#8c847c" font-size="11">Click "Add Route" on any pandal marker to build your trail</text>
        <g transform="translate(800, 11)">
          <rect width="138" height="32" rx="8" fill="#ffffff" stroke="#e5e0d8" stroke-width="1"/>
          <text x="69" y="21" fill="#1a1715" font-size="12" font-weight="700" text-anchor="middle">Open Planner ↗</text>
        </g>
      </g>
    </g>
  </g>

  
  <!-- FOOTER LIGHT (y=842) -->
  <g id="Footer_Desktop_Light" transform="translate(0, 842)">
    <rect width="1440" height="158" fill="#ffffff" fill-opacity="0.85"/>
    <line x1="0" y1="0" x2="1440" y2="0" stroke="#eee8e1" stroke-width="1"/>

    <g transform="translate(144, 28)">
      <!-- Row 1: Brand & Mission -->
      <text x="0" y="22" fill="#b42323" font-size="16" font-weight="800">PujoPath</text>
      <line x1="72" y1="8" x2="72" y2="26" stroke="#eee8e1" stroke-width="1.5"/>
      <text x="84" y="22" fill="#1a1715" font-size="14" font-weight="600">Kolkata Durga Puja Companion</text>
      <text x="0" y="46" fill="#57524c" font-size="13">Explore pandals, plan walking routes, check metro connectivity, and celebrate Bengal.</text>

      <!-- Right: Helpline & About link -->
      <text x="1152" y="22" fill="#1a1715" font-size="14" font-weight="600" text-anchor="end">Helpline &amp; About</text>

      <!-- Divider line -->
      <line x1="0" y1="72" x2="1152" y2="72" stroke="#eee8e1" stroke-width="1"/>

      <!-- Row 2: Copyright & Creator Attribution -->
      <g transform="translate(0, 98)">
        <text x="0" y="16" fill="#57524c" font-size="13">© 2026 PujoPath. All rights reserved.  •  🌸 Festive Pandal &amp; Dhakis  ⏸ Pause</text>
        <text x="1152" y="16" fill="#1a1715" font-size="13" font-weight="600" text-anchor="end">Made by Soumik &amp; Moumita with ❤️</text>
      </g>
    </g>
  </g>
  
</svg>
