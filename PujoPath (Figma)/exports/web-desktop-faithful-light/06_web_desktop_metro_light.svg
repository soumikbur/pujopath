
<svg width="1440" height="1280" viewBox="0 0 1440 1280" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&amp;family=Inter:wght@400;500;600;700;800;900&amp;display=swap');
      text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .bengali { font-family: 'Hind Siliguri', 'Inter', sans-serif; }
    </style>
    <radialGradient id="vignetteLight" cx="50%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#fcfaf7" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#fcfaf7" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#fcfaf7" stop-opacity="0.96"/>
    </radialGradient>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#4a3b32" flood-opacity="0.05"/>
    </filter>
  </defs>

  
  <!-- BACKGROUND LIGHT WITH WARM CREAM -->
  <g id="Page_Background_Light">
    <rect width="1440" height="1280" fill="#fcfaf7"/>
    
    <!-- Subtle Golden/Sepia Mandala Watermarks -->
    <g opacity="0.14" stroke="#c4b5a5" stroke-width="1" fill="none">
      <!-- Left Watermark -->
      <g transform="translate(60, 160)">
        <circle cx="0" cy="0" r="140"/>
        <circle cx="0" cy="0" r="105"/>
        <circle cx="0" cy="0" r="70"/>
        <circle cx="0" cy="0" r="35"/>
        <line x1="-140" y1="0" x2="140" y2="0"/>
        <line x1="0" y1="-140" x2="0" y2="140"/>
        <line x1="-100" y1="-100" x2="100" y2="100"/>
        <line x1="-100" y1="100" x2="100" y2="-100"/>
        <path d="M 0,-105 Q 35,-70 0,-35 Q -35,-70 0,-105 Z"/>
        <path d="M 0,105 Q 35,70 0,35 Q -35,70 0,105 Z"/>
        <path d="M -105,0 Q -70,35 -35,0 Q -70,-35 -105,0 Z"/>
        <path d="M 105,0 Q 70,35 35,0 Q 70,-35 105,0 Z"/>
      </g>
      <!-- Right Watermark -->
      <g transform="translate(1380, 160)">
        <circle cx="0" cy="0" r="140"/>
        <circle cx="0" cy="0" r="105"/>
        <circle cx="0" cy="0" r="70"/>
        <circle cx="0" cy="0" r="35"/>
        <line x1="-140" y1="0" x2="140" y2="0"/>
        <line x1="0" y1="-140" x2="0" y2="140"/>
        <line x1="-100" y1="-100" x2="100" y2="100"/>
        <line x1="-100" y1="100" x2="100" y2="-100"/>
        <path d="M 0,-105 Q 35,-70 0,-35 Q -35,-70 0,-105 Z"/>
        <path d="M 0,105 Q 35,70 0,35 Q -35,70 0,105 Z"/>
        <path d="M -105,0 Q -70,35 -35,0 Q -70,-35 -105,0 Z"/>
        <path d="M 105,0 Q 70,35 35,0 Q 70,-35 105,0 Z"/>
      </g>
    </g>
  
  </g>
  
  
  <!-- HEADER LIGHT (Height: 65px) -->
  <g id="Header_Desktop_Light">
    <rect width="1440" height="65" fill="#ffffff" fill-opacity="0.88"/>
    <line x1="0" y1="65" x2="1440" y2="65" stroke="#eee8e1" stroke-width="1"/>

    <g transform="translate(144, 0)">
      <!-- Logo -->
      <text x="0" y="41" fill="#b42323" font-size="20" font-weight="800" letter-spacing="-0.3">PujoPath</text>
      
      <!-- Nav items -->
      
      <g transform="translate(340, 13)">
        <rect width="78" height="38" rx="12" fill="#f5efe6"/>
        <text x="39" y="24" fill="#1a1715" font-size="14" font-weight="700" text-anchor="middle">Explore</text>
      </g>
    
      <g transform="translate(426, 13)">
        <rect width="78" height="38" rx="12" fill="transparent"/>
        <text x="39" y="24" fill="#57524c" font-size="14" font-weight="700" text-anchor="middle">Map</text>
      </g>
    
      <g transform="translate(512, 13)">
        <rect width="78" height="38" rx="12" fill="transparent"/>
        <text x="39" y="24" fill="#57524c" font-size="14" font-weight="700" text-anchor="middle">Plan</text>
      </g>
    
      <g transform="translate(598, 13)">
        <rect width="78" height="38" rx="12" fill="transparent"/>
        <text x="39" y="24" fill="#57524c" font-size="14" font-weight="700" text-anchor="middle">More ⌵</text>
      </g>
    

      <!-- Right Actions: Install App, Mode, Lang, Saved -->
      <g transform="translate(740, 13)">
        <!-- Install App -->
        <g id="Btn_Install_App">
          <rect width="124" height="38" rx="12" fill="#b42323"/>
          <text x="22" y="24" fill="#ffffff" font-size="14">📥</text>
          <text x="44" y="24" fill="#ffffff" font-size="14" font-weight="700">Install App</text>
        </g>
        <!-- Theme Toggle (Moon icon in light mode) -->
        <g id="Btn_Theme_Toggle" transform="translate(136, 0)">
          <rect width="38" height="38" rx="12" fill="#ffffff" stroke="#eee8e1" stroke-width="1"/>
          <text x="19" y="24" fill="#57524c" font-size="15" text-anchor="middle">🌙</text>
        </g>
        <!-- Lang Pill -->
        <g id="Pill_Lang_Toggle" transform="translate(186, 0)">
          <rect width="88" height="38" rx="12" fill="#ffffff" stroke="#eee8e1" stroke-width="1"/>
          <!-- Active EN -->
          <rect x="4" y="4" width="38" height="30" rx="8" fill="#b42323"/>
          <text x="23" y="23" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">EN</text>
          <!-- Inactive বাংলা -->
          <text x="63" y="23" fill="#57524c" font-size="12" font-weight="700" text-anchor="middle" class="bengali">বাংলা</text>
        </g>
        <!-- Saved Heart -->
        <g id="Btn_Saved_Trails" transform="translate(286, 0)">
          <rect width="38" height="38" rx="12" fill="#ffffff" stroke="#eee8e1" stroke-width="1"/>
          <text x="19" y="24" fill="#57524c" font-size="15" text-anchor="middle">♡</text>
        </g>
      </g>
    </g>
  </g>
  

  <g transform="translate(144, 88)">
    <!-- Label & Title -->
    <text x="0" y="20" fill="#b42323" font-size="12" font-weight="700" letter-spacing="1">TRANSIT SCHEDULES</text>
    <text x="0" y="54" fill="#1a1715" font-size="34" font-weight="800">Kolkata Metro Timetable &amp; Puja Guide</text>
    <text x="0" y="82" fill="#57524c" font-size="14">Official Kolkata Metro Railway operating hours, first/last trains, and 2026 Durga Puja all-night special services.</text>

    <!-- Filter Pills -->
    <g transform="translate(0, 108)">
      <rect x="0" y="0" width="220" height="34" rx="10" fill="#b42323"/>
      <text x="110" y="22" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">🌙 2026 Puja Night Special  TILL 4 AM</text>

      <rect x="230" y="0" width="160" height="34" rx="10" fill="#ffffff" stroke="#eee8e1" stroke-width="1"/>
      <text x="310" y="22" fill="#1a1715" font-size="12" font-weight="600" text-anchor="middle">⏱ Regular Timetables</text>

      <rect x="400" y="0" width="160" height="34" rx="10" fill="#ffffff" stroke="#eee8e1" stroke-width="1"/>
      <text x="480" y="22" fill="#1a1715" font-size="12" font-weight="600" text-anchor="middle">🚇 Stations &amp; Pandals</text>
    </g>

    <!-- Large Red Banner Card -->
    <g transform="translate(0, 160)">
      <rect width="1152" height="140" rx="18" fill="#991b1b" stroke="#7f1d1d" stroke-width="1.5"/>
      <g transform="translate(28, 24)">
        <!-- Badges -->
        <rect x="0" y="0" width="170" height="22" rx="11" fill="#000000" fill-opacity="0.3"/>
        <text x="85" y="15" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">ALL-NIGHT METRO SERVICE</text>

        <rect x="178" y="0" width="180" height="22" rx="11" fill="#facc15" fill-opacity="0.2"/>
        <text x="268" y="15" fill="#facc15" font-size="9" font-weight="700" text-anchor="middle">SAPTAMI • ASHTAMI • NAVAMI</text>

        <text x="0" y="52" fill="#FFFFFF" font-size="22" font-weight="800">Overnight Trains Running 1:00 PM to 4:00 AM Next Morning</text>
        <text x="0" y="74" fill="#fecaca" font-size="12">Special overnight operations on the Blue Line (Dakshineswar – Kavi Subhash) and Green Line (Howrah Maidan – Salt Lake Sector V) with 6-minute peak frequency.</text>
        
        <text x="0" y="96" fill="#fca5a5" font-size="11">✓ Verified: 12 October 2026   Official Indian Railways Notice ↗</text>
      </g>
    </g>

    <!-- 2-Column Schedule Grid (5 Cards) -->
    <g transform="translate(0, 320)">
      <!-- Row 1 -->
      <!-- Card 1: Blue Line All-Night -->
      <g transform="translate(0, 0)">
        <rect width="564" height="200" rx="18" fill="#ffffff" stroke="#eee8e1" stroke-width="1"/>
        <g transform="translate(24, 20)">
          <text x="0" y="18" fill="#1a1715" font-size="16" font-weight="800">Blue Line — Maha Saptami to Navami</text>
          <rect x="440" y="0" width="76" height="22" rx="6" fill="#feeceb"/>
          <text x="478" y="15" fill="#b42323" font-size="10" font-weight="700" text-anchor="middle">🌙 All-Night</text>
          <text x="0" y="38" fill="#736c65" font-size="11">📅 17 October 2026 – 19 October 2026 (Saptami, Ashtami, Navami)</text>

          <rect y="50" width="516" height="52" rx="10" fill="#fdfbf7" stroke="#eee8e1" stroke-width="1"/>
          <text x="16" y="72" fill="#736c65" font-size="10">First Train</text>
          <text x="16" y="90" fill="#1a1715" font-size="13" font-weight="700">01:00 PM (Afternoon start)</text>
          <text x="280" y="72" fill="#736c65" font-size="10">Last Train</text>
          <text x="280" y="90" fill="#b42323" font-size="13" font-weight="700">04:00 AM (Next Morning)</text>

          <text x="0" y="122" fill="#b42323" font-size="11">⏱ Peak Headway: Every 6 minutes</text>
          <text x="0" y="140" fill="#736c65" font-size="11">Official Special Durga Puja night timetable: Trains operate continuously.</text>
        </g>
      </g>

      <!-- Card 2: Green Line Sector V to Sealdah -->
      <g transform="translate(588, 0)">
        <rect width="564" height="200" rx="18" fill="#ffffff" stroke="#eee8e1" stroke-width="1"/>
        <g transform="translate(24, 20)">
          <text x="0" y="18" fill="#1a1715" font-size="16" font-weight="800">Green Line — Salt Lake Sector V to Sealdah</text>
          <rect x="440" y="0" width="76" height="22" rx="6" fill="#feeceb"/>
          <text x="478" y="15" fill="#b42323" font-size="10" font-weight="700" text-anchor="middle">🌙 All-Night</text>
          <text x="0" y="38" fill="#736c65" font-size="11">📅 17 October 2026 – 19 October 2026</text>

          <rect y="50" width="516" height="52" rx="10" fill="#fdfbf7" stroke="#eee8e1" stroke-width="1"/>
          <text x="16" y="72" fill="#736c65" font-size="10">First Train</text>
          <text x="16" y="90" fill="#1a1715" font-size="13" font-weight="700">01:30 PM</text>
          <text x="280" y="72" fill="#736c65" font-size="10">Last Train</text>
          <text x="280" y="90" fill="#b42323" font-size="13" font-weight="700">03:59 AM (Next Morning)</text>

          <text x="0" y="122" fill="#16a34a" font-size="11">⏱ Peak Headway: Every 8 minutes</text>
          <text x="0" y="140" fill="#736c65" font-size="11">Special night trains connecting Howrah and Salt Lake pandals.</text>
        </g>
      </g>

      <!-- Row 2 -->
      <!-- Card 3: Green Line Howrah Maidan to Esplanade -->
      <g transform="translate(0, 218)">
        <rect width="564" height="190" rx="18" fill="#ffffff" stroke="#eee8e1" stroke-width="1"/>
        <g transform="translate(24, 20)">
          <text x="0" y="18" fill="#1a1715" font-size="16" font-weight="800">Green Line — Howrah Maidan to Esplanade</text>
          <rect x="440" y="0" width="76" height="22" rx="6" fill="#feeceb"/>
          <text x="478" y="15" fill="#b42323" font-size="10" font-weight="700" text-anchor="middle">🌙 All-Night</text>
          <text x="0" y="38" fill="#736c65" font-size="11">Underwater river tunnel transit corridor across Hooghly</text>

          <rect y="50" width="516" height="52" rx="10" fill="#fdfbf7" stroke="#eee8e1" stroke-width="1"/>
          <text x="16" y="72" fill="#736c65" font-size="10">First Train</text>
          <text x="16" y="90" fill="#1a1715" font-size="13" font-weight="700">02:00 PM</text>
          <text x="280" y="72" fill="#736c65" font-size="10">Last Train</text>
          <text x="280" y="90" fill="#b42323" font-size="13" font-weight="700">03:00 AM</text>

          <text x="0" y="122" fill="#736c65" font-size="11">Direct connectivity for Central &amp; Howrah pandal visitors.</text>
        </g>
      </g>

      <!-- Card 4: Purple Line (Joka to Taratala) -->
      <g transform="translate(588, 218)">
        <rect width="564" height="190" rx="18" fill="#ffffff" stroke="#eee8e1" stroke-width="1"/>
        <g transform="translate(24, 20)">
          <text x="0" y="18" fill="#1a1715" font-size="16" font-weight="800">Purple Line — Joka to Majerhat</text>
          <rect x="440" y="0" width="76" height="22" rx="6" fill="#dbeafe"/>
          <text x="478" y="15" fill="#2563eb" font-size="10" font-weight="700" text-anchor="middle">Extended</text>
          <text x="0" y="38" fill="#736c65" font-size="11">Special services for Behala and South-West Kolkata</text>

          <rect y="50" width="516" height="52" rx="10" fill="#fdfbf7" stroke="#eee8e1" stroke-width="1"/>
          <text x="16" y="72" fill="#736c65" font-size="10">Operating Hours</text>
          <text x="16" y="90" fill="#1a1715" font-size="13" font-weight="700">08:30 AM to 09:30 PM</text>
          <text x="280" y="72" fill="#736c65" font-size="10">Frequency</text>
          <text x="280" y="90" fill="#1a1715" font-size="13" font-weight="700">Every 25 mins</text>

          <text x="0" y="122" fill="#736c65" font-size="11">Key connection for Behala Natun Dal and Barisha pandals.</text>
        </g>
      </g>
    </g>
  </g>

  
  <!-- FOOTER LIGHT (y=1122) -->
  <g id="Footer_Desktop_Light" transform="translate(0, 1122)">
    <rect width="1440" height="158" fill="#ffffff" fill-opacity="0.85"/>
    <line x1="0" y1="0" x2="1440" y2="0" stroke="#eee8e1" stroke-width="1"/>

    <g transform="translate(144, 28)">
      <!-- Row 1: Brand & Mission -->
      <text x="0" y="22" fill="#b42323" font-size="16" font-weight="800">PujoPath</text>
      <line x1="72" y1="8" x2="72" y2="26" stroke="#eee8e1" stroke-width="1.5"/>
      <text x="84" y="22" fill="#1a1715" font-size="14" font-weight="600">Kolkata Durga Puja Companion</text>
      <text x="0" y="46" fill="#57524c" font-size="13">Explore pandals, plan walking routes, check metro connectivity, and celebrate Bengal.</text>

      <!-- Right: Helpline & About link -->
      <text x="1152" y="22" fill="#1a1715" font-size="14" font-weight="600" text-anchor="end">Helpline &amp; About</text>

      <!-- Divider line -->
      <line x1="0" y1="72" x2="1152" y2="72" stroke="#eee8e1" stroke-width="1"/>

      <!-- Row 2: Copyright & Creator Attribution -->
      <g transform="translate(0, 98)">
        <text x="0" y="16" fill="#57524c" font-size="13">© 2026 PujoPath. All rights reserved.  •  🌸 Festive Pandal &amp; Dhakis  ⏸ Pause</text>
        <text x="1152" y="16" fill="#1a1715" font-size="13" font-weight="600" text-anchor="end">Made by Soumik &amp; Moumita with ❤️</text>
      </g>
    </g>
  </g>
  
</svg>
